<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bean There – Cafe Profile</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #efe8d6;
      --sidebar: #737109;
      --accent: #7f7b2e;
      --muted: #8b8578;
      --content-width: 1500px;
      --review-bg: #cfe0ff;
      --orange: #ee6a45;
      --text: #2b2b2b;
      --border: rgba(127,123,46,0.45);
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      height:100%;
      font-family:Montserrat, system-ui, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .frame{
      width:100%;
      min-height:100vh;
      padding:10px;
    }

    .layout{
      display:grid;
      grid-template-columns: 170px 1fr;
      gap:14px;
      min-height: calc(100vh - 20px);
    }

    .sidebar{
      background:var(--sidebar);
      color:#fff;
      border-radius:18px;
      padding:22px 18px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .logo{
      font-family:Lora, serif;
      font-size:28px;
      font-weight:700;
      line-height:0.95;
      margin-bottom:40px;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:24px;
      margin-top:80px;
    }

    .nav a,
    .auth a{
      color:#fff;
      text-decoration:none;
      font-size:18px;
    }

    .nav a:hover,
    .auth a:hover{
      color:#f6d87c;
    }

    .auth{
      display:flex;
      flex-direction:column;
      gap:18px;
      font-size:18px;
    }

    .main{
      border:1.5px solid var(--border);
      border-radius:22px;
      padding:26px 24px 32px;
      position:relative;
    }

    .cafe-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:20px;
      margin-bottom:34px;
    }
    .cafe-handle-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 8px;
}

    .cafe-left{
      display:flex;
      gap:18px;
      align-items:flex-start;
    }

    .cafe-image{
      width:120px;
      height:88px;
      border-radius:8px;
      overflow:hidden;
      background:#cde7ff;
      flex-shrink:0;
    }

    .cafe-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .cafe-meta h1{
      margin:0;
      font-size:38px;
      font-weight:700;
      line-height:1;
    }

    .cafe-handle{
      color:#294b83;
      font-size:18px;
      margin-top:8px;
      font-weight:500;
    }

    .cafe-bio{
      margin-top:6px;
      color:#6e675d;
      font-size:16px;
    }

    .edit-cafe-btn{
      margin-top:10px;
      padding:6px 22px;
      border-radius:22px;
      border:1.5px solid var(--accent);
      background:transparent;
      font-size:14px;
      cursor:pointer;
    }

    .edit-cafe-btn:hover{
      background:rgba(127,123,46,0.08);
    }

    .sort-pill{
      align-self:flex-end;
      display:flex;
      align-items:center;
      gap:10px;
      border:1.5px solid var(--accent);
      border-radius:28px;
      padding:12px 18px;
      background:transparent;
      font-size:16px;
    }

    .sort-icon{
      width:18px;
      height:14px;
      position:relative;
      display:inline-block;
    }

    .sort-icon::before,
    .sort-icon::after,
    .sort-icon span{
      content:"";
      position:absolute;
      left:0;
      height:2px;
      background:#2b2b2b;
      border-radius:3px;
    }

    .sort-icon::before{
      top:0;
      width:100%;
    }

    .sort-icon span{
      top:6px;
      width:70%;
    }

    .sort-icon::after{
      top:12px;
      width:45%;
    }

    .section{
      margin-top:28px;
    }

    .section-title{
      text-align:center;
      font-size:24px;
      font-weight:500;
      margin:0 0 16px;
    }

    .carousel-wrapper{
      position:relative;
      padding:0 38px;
    }

    .arrow{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:32px;
      height:32px;
      border-radius:50%;
      border:none;
      background:var(--orange);
      color:#fff;
      font-size:24px;
      font-weight:700;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:2;
    }

    .arrow.left{ left:0; }
    .arrow.right{ right:0; }

    .blue-box{
      background:var(--review-bg);
      border-radius:10px;
      min-height:112px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#2f2f2f;
      font-size:16px;
    }
  .reviews-carousel{
  background: #dce6f7;
  border-radius: 20px;
  min-height: 220px;
  padding: 22px 26px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
}

.review-card{
  background: #dce6f7;
  border-radius: 20px;
  padding: 0;
  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 18px;
  width: 100%;
  max-width: 100%;
  box-shadow: none;
  text-align: left;
}

.review-img{
  width: 170px;
  height: 170px;
  border-radius: 18px;
  object-fit: cover;
  display: block;
}

.review-content{
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.review-top{
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 18px;
}

.review-meta{
  min-width: 0;
}

.review-user{
  font-size: 15px;
  font-weight: 700;
  color: #2c3e63;
  line-height: 1.1;
}

.review-date{
  font-size: 12px;
  color: #6f7685;
  margin-top: 2px;
}

.amenities-list{
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: flex-end;
  font-size: 13px;
  color: #58627a;
}

.amenity-item{
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.cafe-title-row{
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 4px;
}

.cafe-name-card{
  margin: 0;
  font-family: Lora, serif;
  font-size: 26px;
  line-height: 1.05;
  font-weight: 700;
  color: #d96a1d;
}

.rating-beans{
  display: flex;
  align-items: center;
  gap: 3px;
}

.cafe-address{
  margin-top: 4px;
  font-size: 15px;
  font-weight: 700;
  color: #2f446b;
}

.review-text{
  margin: 10px 0 12px;
  font-size: 15px;
  line-height: 1.45;
  color: #556070;
  max-width: 100%;
}

.review-btn-container{
  display: flex;
  justify-content: flex-end;
  margin-top: auto;
}

.btn-reply-review{
  background: transparent;
  border: 1.5px solid var(--accent);
  border-radius: 999px;
  padding: 7px 22px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.btn-reply-review:hover{
  background: rgba(127,123,46,0.08);
}
    @media (max-width: 900px){
      .layout{
        grid-template-columns:1fr;
      }

      .sidebar{
        min-height:auto;
      }

      .cafe-header{
        flex-direction:column;
        align-items:flex-start;
      }

      .sort-pill{
        align-self:flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="layout">

      <aside class="sidebar">
        <div>
          <div class="logo">bean<br>there</div>

          <nav class="nav">
            <a href="cafeprofile.html">My Cafe Profile</a>
            <a href="cafereviews.html">Reviews</a>
          </nav>
        </div>

        <div class="auth">
          <a href="index.html">Log in</a>
          <a href="index.html">Sign up</a>
        </div>
      </aside>

      <main class="main">
        <div class="cafe-header">
          <div class="cafe-left">
            <div class="cafe-image">
  <img id="cafeImage" src="icons/default-cafe.jpg" alt="Cafe photo">
</div>

<div class="cafe-meta">
  <h1 id="cafeName">Cafe Name</h1>

  <div class="cafe-handle-row">
    <div class="cafe-handle" id="cafeHandle">@cafename</div>
   <button id="editCafeBtn" class="edit-cafe-btn">Edit Cafe</button>
  </div>

  <div class="cafe-bio" id="cafeBio">Placeholder for short bio</div>
</div>
          </div>

          <div class="sort-pill">
            <span class="sort-icon"><span></span></span>
            <span>Date Posted</span>
          </div>
        </div>

        <section class="section">
          <h2 class="section-title">My Cafe Reviews</h2>
          <div class="carousel-wrapper">
            <button class="arrow left">‹</button>
            <div id="reviewsContainer" class="reviews-carousel">
  Loading reviews...
</div>
            <button class="arrow right">›</button>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">My Replies</h2>
          <div class="carousel-wrapper">
            <button class="arrow left">‹</button>
            <div class="blue-box">
              No replies yet.
            </div>
            <button class="arrow right">›</button>
          </div>
        </section>
      </main>

    </div>
  </div>
  
<div id="editCafeModal" class="modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-backdrop" data-close-cafe></div>

  <div class="modal-panel" role="document">
    <header style="display:flex;align-items:center;justify-content:space-between;">
      <h3 style="margin:0">Edit Cafe</h3>
      <button class="modal-close" aria-label="Close" data-close-cafe>✕</button>
    </header>

    <form id="editCafeForm" style="margin-top:14px;">
      <div style="display:flex;gap:14px;align-items:center;">
        <div style="flex:0 0 auto; text-align:center;">
          <div style="width:84px; height:84px; border-radius:12px; overflow:hidden; border:2px solid #e6eaea; display:inline-block;">
            <img id="modalCafePreview" src="https://placehold.co/120x88/cfe0ff/6b7280?text=Cafe" alt="preview" style="width:100%; height:100%; object-fit:cover; display:block;">
          </div>
        </div>

        <div style="flex:1;">
          <label for="inputCafeImage" style="display:block;font-weight:600;margin-bottom:6px;">Cafe picture</label>
          <input id="inputCafeImage" type="file" accept="image/*" />
          <div style="font-size:13px;color:#666;margin-top:6px;">PNG/JPG, max 3 MB. Preview shown above.</div>

          <div style="margin-top:8px;">
            <button type="button" id="removeCafeImageBtn" style="padding:6px 10px;border-radius:8px;border:1px solid rgba(0,0,0,0.08);background:transparent;cursor:pointer;">Remove photo</button>
          </div>
        </div>
      </div>

      <label for="inputCafeBio" style="display:block;margin-top:14px;margin-bottom:6px;font-weight:600;">Short bio</label>
      <textarea id="inputCafeBio" rows="4" placeholder="Write a short bio..." style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(0,0,0,0.12);font-size:15px;"></textarea>

      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px;">
        <button type="button" data-close-cafe style="padding:8px 12px;border-radius:8px;border:1px solid rgba(0,0,0,0.08);background:transparent;cursor:pointer;">Cancel</button>
        <button type="submit" style="padding:8px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer;font-weight:700;">Save</button>
      </div>
    </form>
  </div>
</div>
<script>
let currentCafeData = null;

// CHECK OWNER SESSION
async function checkOwnerSession() {
  try {
    const response = await fetch('/session-owner');
    const result = await response.json();

    if (!response.ok || !result.loggedIn) {
      window.location.href = 'index.html';
      return false;
    }
    return true;
  } catch (err) {
    console.error(err);
    window.location.href = 'index.html';
    return false;
  }
}
async function loadCafeReviews(cafeId) {
  try {
    const response = await fetch(`/reviews-by-cafe/${cafeId}`);
    const reviews = await response.json();

    const container = document.getElementById('reviewsContainer');

    if (!reviews.length) {
      container.innerHTML = `<p style="margin:auto; color:#666;">No reviews for your cafe yet.</p>`;
      return;
    }

    const review = reviews[0];

    const displayDate =
      review.datePosted && review.datePosted.trim() !== ''
        ? review.datePosted
        : (review.createdAt ? new Date(review.createdAt).toLocaleDateString() : 'No date');

    const beansHtml = getBeanRatingHtml(review.rating);

    const tagsHtml = (review.tags || []).map(tag => {
      const icon = tagIcons[tag];
      return `
        <div class="amenity-item">
          ${icon ? `<img src="${icon}" style="width:14px;height:14px;object-fit:contain;">` : ``}
          <span>${tag}</span>
        </div>
      `;
    }).join('');

    const reviewImage =
      review.photoUrl && review.photoUrl.trim() !== ''
        ? review.photoUrl
        : (review.image ? `/${review.image}` : 'apdev-tbv/cafe4.jpg');

    container.innerHTML = `
      <div class="review-card">
        <img src="${reviewImage}" alt="${review.establishmentName}" class="review-img">

        <div class="review-content">
          <div class="review-top">
            <div class="review-meta">
              <div class="review-user">${review.username}</div>
              <div class="review-date">${displayDate}</div>
            </div>

            <div class="amenities-list">
              ${tagsHtml}
            </div>
          </div>

          <div class="cafe-title-row">
            <h3 class="cafe-name-card">${review.establishmentName}</h3>
            <div class="rating-beans">${beansHtml}</div>
          </div>

          <div class="cafe-address">${review.location || 'Location not available'}</div>

          <div class="review-text">${review.reviewText}</div>

          <div class="review-btn-container">
            <button class="btn-reply-review">Reply</button>
          </div>
        </div>
      </div>
    `;
  } catch (err) {
    console.error(err);
    document.getElementById('reviewsContainer').innerHTML =
      `<p style="margin:auto; color:#666;">Error loading reviews.</p>`;
  }
}

// LOAD CAFE DATA
async function loadOwnerCafe() {
  try {
    const response = await fetch('/owner-establishment');
    const cafe = await response.json();

    if (!response.ok) {
      alert(cafe.message || 'Failed to load cafe profile.');
      return;
    }

    currentCafeData = cafe;

    document.getElementById('cafeName').textContent = cafe.name || 'Cafe Name';
    document.getElementById('cafeHandle').textContent = cafe.handle || '@cafename';
    document.getElementById('cafeBio').textContent = cafe.bio || 'No bio yet.';

    const img = document.getElementById('cafeImage');

    if (Array.isArray(cafe.imageUrl) && cafe.imageUrl.length > 0) {
      img.src = '/' + cafe.imageUrl[0];
    } else if (typeof cafe.imageUrl === 'string' && cafe.imageUrl.trim() !== '') {
      img.src = '/' + cafe.imageUrl;
    } else {
      img.src = 'https://placehold.co/120x88/cfe0ff/6b7280?text=Cafe';
    }
  } catch (err) {
    console.error(err);
    alert('Error loading cafe profile.');
  }
}

// MODAL LOGIC
function setupEditCafe() {
  const editCafeBtn = document.getElementById('editCafeBtn');
  const editCafeModal = document.getElementById('editCafeModal');
  const editCafeForm = document.getElementById('editCafeForm');
  const inputCafeBio = document.getElementById('inputCafeBio');
  const inputCafeImage = document.getElementById('inputCafeImage');
  const modalCafePreview = document.getElementById('modalCafePreview');
  const removeCafeImageBtn = document.getElementById('removeCafeImageBtn');

  function openCafeModal() {
    if (!currentCafeData) return;

    inputCafeBio.value = currentCafeData.bio || '';

    if (Array.isArray(currentCafeData.imageUrl) && currentCafeData.imageUrl.length > 0) {
      modalCafePreview.src = '/' + currentCafeData.imageUrl[0];
    } else {
      modalCafePreview.src = 'https://placehold.co/120x88/cfe0ff/6b7280?text=Cafe';
    }

    editCafeModal.hidden = false;
  }

  function closeCafeModal() {
    editCafeModal.hidden = true;
    inputCafeImage.value = '';
  }

  editCafeBtn.addEventListener('click', openCafeModal);

  document.querySelectorAll('[data-close-cafe]').forEach(btn => {
    btn.addEventListener('click', closeCafeModal);
  });

  inputCafeImage.addEventListener('change', function() {
    const file = inputCafeImage.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => modalCafePreview.src = e.target.result;
    reader.readAsDataURL(file);
  });

  removeCafeImageBtn.addEventListener('click', function() {
    modalCafePreview.src = 'https://placehold.co/120x88/cfe0ff/6b7280?text=Cafe';
    inputCafeImage.value = '';
  });

  editCafeForm.addEventListener('submit', async function(e) {
    e.preventDefault();

    let newImage = null;
    const file = inputCafeImage.files[0];

    if (file) {
      newImage = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = ev => resolve(ev.target.result);
        reader.readAsDataURL(file);
      });
    }

    try {
      const response = await fetch('/update-cafe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bio: inputCafeBio.value.trim(),
          imageUrl: newImage
        })
      });

      const result = await response.json();

      if (!response.ok) {
        alert(result.message || 'Failed to update cafe.');
        return;
      }

      closeCafeModal();
      await loadOwnerCafe();
      alert('Cafe updated successfully!');
    } catch (err) {
      console.error(err);
      alert('Error updating cafe.');
    }
  });
}
const tagIcons = {
  "Air-conditioned": "icons/ac.png",
  "Socket": "icons/socket.png",
  "Wi-Fi": "icons/wifi.png",
  "Alt Milk": "icons/oat.png"
};

function getBeanRatingHtml(rating) {
  let beansHtml = '';

  for (let i = 0; i < 5; i++) {
    if (i < rating) {
      beansHtml += `<img src="icons/bean.png" style="width:18px;height:18px;">`;
    } else {
      beansHtml += `<img src="icons/bean.png" style="width:18px;height:18px;opacity:0.3;filter:grayscale(1);">`;
    }
  }

  return beansHtml;
}

// RUN EVERYTHING
window.addEventListener('DOMContentLoaded', async () => {
  const ok = await checkOwnerSession();
  if (ok) {
    await loadOwnerCafe();
    setupEditCafe();

    if (currentCafeData && currentCafeData._id) {
      await loadCafeReviews(currentCafeData._id);
    }
  }
});

</script>
</body>
</html>
