<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bean There – Cafe Profile</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #efe8d6;
      --sidebar: #5b5f10;
      --accent: #7f7b2e;
      --muted: #bfb0a8;
      --content-width: 1500px;
      --review-bg: #cfe0ff;
      --orange: #ee6a45;
    }

    @keyframes floatUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-on-load { opacity:0; animation: floatUp 0.9s ease-out forwards; }
    .delay-1 { animation-delay: 0.15s; }
    .delay-2 { animation-delay: 0.35s; }

    *{ box-sizing: border-box; }
    html, body{
      height: 100%;
      margin: 0;
      font-family: Montserrat, system-ui, sans-serif;
      background: var(--bg);
      color: #2b2b2b;
    }

    .frame{ width:100%; height:100vh; overflow:hidden; }

    .layout{
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100%;
      column-gap: 18px;
    }

    /* ── SIDEBAR ── */
    .sidebar{
      background: var(--sidebar);
      color: #fff;
      padding: 28px;
      margin: 18px 0 18px 18px;
      border-radius: 22px;
      height: calc(100% - 36px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .logo{ font-family:Lora,serif; font-size:42px; font-weight:700; letter-spacing:1px; }
    .nav{ margin-top:36px; display:flex; flex-direction:column; gap:26px; }
    .nav a{ color:#fff; text-decoration:none; font-size:20px; }
    .auth{ font-size:20px; }
    .sidebar .nav a:hover,
    .sidebar .auth div:hover{ color:#fa7a11; cursor:pointer; transition:0.3s; }

    /* ── MAIN ── */
    .main{
      height: calc(100% - 36px);
      margin: 18px 18px 0 0;
      padding: 24px 28px;
      border: 1.5px solid rgba(127,123,46,0.4);
      border-radius: 24px;
      overflow-y: auto;
      position: relative;
    }

    /* ── CAFE HEADER (same as cafe.html) ── */
    .cafe-header{
      max-width: var(--content-width);
      margin: 0 auto 22px;
    }
    .cafe-name-row{
      display: flex;
      align-items: baseline;
      gap: 18px;
      flex-wrap: wrap;
    }
    .cafe-name{
      font-family: Lora, serif;
      font-size: 44px;
      font-weight: 700;
      color: #c0441a;
      margin: 0;
    }
    .cafe-score{
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 600;
    }
    .score-divider{ color: var(--muted); }

    /* ── PHOTO GRID (same as cafe.html) ── */
    .photo-grid{
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
      border-radius: 16px;
      overflow: hidden;
    }
    .photo-grid img{
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      border-radius: 8px;
    }

    /* ── CAFE META BELOW PHOTOS ── */
    .cafe-meta{
      margin-bottom: 28px;
    }
    .cafe-handle{
      color: #2b5b6f;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .cafe-bio{
      color: var(--muted);
      margin: 0 0 10px;
    }
    .edit-cafe-btn{
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1.5px solid rgba(127,123,46,0.4);
      background: transparent;
      cursor: pointer;
      font-weight: 600;
      font-family: Montserrat, sans-serif;
    }
    .edit-cafe-btn:hover{ background: rgba(127,123,46,0.08); }

    /* ── REVIEWS (identical to ratings.html) ── */
    .reviews{
      max-width: var(--content-width);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .reviews-title{
      font-size: 26px;
      font-family: Lora, serif;
      margin: 0 0 4px;
    }
    .review-card{
      background: var(--review-bg);
      border-radius: 22px;
      padding: 22px;
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 22px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .review-card:hover{ transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,0.12); }
    .review-img{
      width: 100%;
      height: 180px;
      border-radius: 16px;
      overflow: hidden;
      background: #dfe8f5;
    }
    .review-img img{ width:100%; height:100%; object-fit:cover; }
    .review-content{ display:flex; flex-direction:column; gap:8px; }
    .review-top{
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #253d67;
    }
    .review-title{
      font-family: Lora, serif;
      font-size: 28px;
      color: #d45a2a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .review-location{ color:#253d67; font-size:15px; font-weight:600; margin-top:-8px; }
    .review-tags{ display:flex; gap:14px; font-size:13px; color:#253d67; flex-wrap:wrap; }
    .tag{ display:inline-flex; align-items:center; gap:6px; }
    .tag img{ width:14px; height:14px; }
    .rating{ display:inline-flex; gap:4px; margin-left:6px; }
    .rating img{ width:18px; height:18px; }
    .review-text{ font-size:14px; line-height:1.5; }

    /* ── EDIT CAFE MODAL (same style as write/edit review in profile.html) ── */
    .modal{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:2000; }
    .modal[hidden]{ display:none; }
    .modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,0.3); }
    .modal-panel{ position:relative; background:#fff; padding:30px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.2); width:90%; z-index:2001; }

    .edit-cafe-panel{
      background-color: #f8f5ee;
      border-radius: 20px;
      padding: 30px 26px;
      width: min(520px, calc(100% - 32px));
      position: relative;
    }
    .edit-cafe-title{
      font-family: 'Lora', serif;
      font-size: 34px;
      margin: 0 0 18px;
      text-align: center;
      color: #4a3f35;
    }
    .modal-close-cafe{
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 28px;
      color: #4a3f35;
      border: none;
      background: transparent;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close-cafe:hover{ opacity: 0.7; }
    .ec-row{ display:flex; align-items:flex-start; gap:14px; margin:12px 0; }
    .ec-row label{ width:120px; font-weight:700; color:#4a3f35; padding-top:6px; }
    .ec-row textarea{
      flex: 1;
      min-height: 100px;
      border-radius: 14px;
      border: 1.5px solid rgba(0,0,0,0.18);
      padding: 14px;
      resize: none;
      font-family: Montserrat, sans-serif;
      font-size: 15px;
    }
    .ec-actions{ display:flex; justify-content:center; margin-top:18px; }
    .btn-save-cafe{
      background-color: transparent;
      color: #4a3f35;
      border: 2px solid #4a3f35;
      border-radius: 30px;
      padding: 10px 50px;
      font-size: 20px;
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-save-cafe:hover{ background-color: #4a3f35; color: #fff; }

    @media(max-width:880px){
      .layout{ grid-template-columns:1fr; }
      .sidebar{ order:2; height:auto; }
      .main{ order:1; }
      .review-card{ grid-template-columns:1fr; }
      .review-img{ height:200px; }
      .photo-grid{ grid-template-columns:repeat(3,1fr); }
    }
.reviews-carousel{
  background: #dce6f7;
  border-radius: 20px;
  min-height: 220px;
  padding: 22px 26px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
}

.section{
  margin-top: 28px;
}

.section-title{
  text-align: center;
  font-size: 24px;
  font-weight: 500;
  margin: 0 0 16px;
}

.carousel-wrapper{
  position: relative;
  padding: 0 38px;
}

.arrow{
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--orange);
  color: #fff;
  font-size: 24px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.arrow.left{ left: 0; }
.arrow.right{ right: 0; }

.review-card{
  background: #dce6f7;
  border-radius: 20px;

  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 18px;
  width: 100%;
  max-width: 100%;
  box-shadow: none;
  text-align: left;
}

.review-img{
  width: 170px;

  border-radius: 18px;
  object-fit: cover;
  display: block;
  overflow: hidden;
  background: #dfe8f5;
}

.review-img img{
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.review-content{
  min-width: 0;
  display: flex;

  justify-content: flex-start;
}

.review-top{

}

.review-meta{
  min-width: 0;
}

.review-user{
  font-size: 15px;

  line-height: 1.1;
}

.review-date{
  font-size: 12px;

  margin-top: 2px;
}

.amenities-list{
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: flex-end;
  font-size: 13px;
  color: #58627a;
}

.amenity-item{
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.cafe-title-row{
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 4px;
}

.cafe-name-card{
  margin: 0;
  font-family: Lora, serif;

}

.rating-beans{
  display: flex;
  align-items: center;
  gap: 3px;
}

.cafe-address{
  margin-top: 4px;
  font-size: 15px;
  font-weight: 700;
  color: #2f446b;
}

  margin: 10px 0 12px;

}

.review-btn-container{
  display: flex;
  justify-content: flex-end;
  margin-top: auto;
}

.btn-reply-review{
  background: transparent;
  border: 1.5px solid var(--accent);
  border-radius: 999px;
  padding: 7px 22px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.btn-reply-review:hover{
  background: rgba(127,123,46,0.08);
}

.review-actions {
  display: flex;
  gap: 18px;
  margin-top: 25px;
  align-items: center;
}

@media(max-width:880px){
  .layout{ grid-template-columns:1fr; }
  .sidebar{ order:2; height:auto; }
  .main{ order:1; }
  .review-card{ grid-template-columns:1fr; }
  .review-img{ height:200px; width:100%; }
  .photo-grid{ grid-template-columns:repeat(3,1fr); }
}
    
    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn img {
      width: 20px;
      height: 20px;
    }
    .faded { opacity: 0.3; filter: grayscale(1); }
    .active { opacity: 1; filter: none; }
      </style>
</head>

<body>
<div class="frame">
  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar animate-on-load delay-1">
      <div>
        <div class="logo">bean<br>there</div>
        <nav class="nav">
          <a href="cafeprofile.html">My Cafe Profile</a>
          <a href="cafereviews.html">Reviews</a>
        </nav>
      </div>
      <div class="auth" id="authSection">
        <div id="loginBtn" style="margin-bottom:14px">Log in</div>
        <div id="signupBtn">Sign up</div>
      </div>
      <div class="auth" id="userSection" style="display:none;">
        <div id="welcomeUser" style="margin-bottom:14px"></div>
        <div id="logoutBtn">Log out</div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main animate-on-load delay-2">

      <!-- Cafe Header: name + rating -->
      <div class="cafe-header">
        <div class="cafe-name-row">
          <h1 class="cafe-name" id="cafeName">Loading…</h1>
          <div class="cafe-score">
            <img src="icons/bean.png" alt="bean" style="width:20px;height:20px;">
            <span id="cafeRating">—</span>
          </div>
        </div>
        <div id="cafeLocation" style="font-size:15px; color:#6b6151; margin-top:4px;"></div>
      </div>

<!-- Photo Grid -->
<div class="photo-grid" id="cafePhotoGrid"></div>

<section class="section">
  <h2 class="section-title">My Cafe Reviews</h2>
  <div class="carousel-wrapper">
    <button class="arrow left">‹</button>
    <div id="reviewsContainer" class="reviews-carousel">
      Loading reviews...
    </div>
    <button class="arrow right">›</button>
  </div>
</section>

      <!-- Cafe Meta: handle, bio, edit button -->
      <div class="cafe-meta">
        <div class="cafe-handle" id="cafeHandle">@cafename</div>
        <p class="cafe-bio" id="cafeBio">Placeholder for short bio</p>
        <button id="editCafeBtn" class="edit-cafe-btn">Edit Cafe</button>
      </div>

      
    </main>
  </div>
</div>

<!-- EDIT CAFE MODAL -->
<div id="editCafeModal" class="modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-backdrop" data-close-cafe></div>
  <div class="modal-panel edit-cafe-panel" role="document">
    <button class="modal-close-cafe" aria-label="Close" data-close-cafe>✕</button>
    <h3 class="edit-cafe-title">Edit Cafe</h3>

    <form id="editCafeForm">
      <div class="ec-row">
        <label>Photos</label>
        <div style="flex:1;">
          <div id="cafePhotosGrid" style="display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:10px;"></div>
          <input id="inputCafeImage" type="file" accept="image/*" multiple style="font-size:13px;">
          <div style="font-size:12px; color:#888; margin-top:4px;">Select up to 5 photos to replace all current ones.</div>
        </div>
      </div>

      <div class="ec-row">
        <label for="inputCafeBio">Bio</label>
        <textarea id="inputCafeBio" placeholder="Write a short bio..."></textarea>
      </div>

      <div class="ec-actions">
        <button type="submit" class="btn-save-cafe">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="replyModal" class="modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-backdrop" data-close-reply></div>
  <div class="modal-panel edit-cafe-panel" role="document">
    <button class="modal-close-cafe" data-close-reply>✕</button>
    <h3 class="edit-cafe-title">Reply to Review</h3>
    <form id="replyForm">
      <input type="hidden" id="replyReviewId">
      <div class="ec-row">
        <label for="replyText">Reply</label>
        <textarea id="replyText" placeholder="Write your reply..."></textarea>
      </div>
      <div class="ec-actions">
        <button type="submit" class="btn-save-cafe">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  // ── AUTH SIDEBAR ──
  const authSection = document.getElementById('authSection');
  const userSection = document.getElementById('userSection');
  const welcomeUser = document.getElementById('welcomeUser');
  const logoutBtn   = document.getElementById('logoutBtn');
  const loginBtn    = document.getElementById('loginBtn');
  const signupBtn   = document.getElementById('signupBtn');

  function updateUI() {
    const username = localStorage.getItem('beanthere_owner_username') || localStorage.getItem('beanthere_profile_username');
    if (username) {
      authSection.style.display = 'none';
      userSection.style.display = 'block';
      welcomeUser.textContent = username;
    } else {
      authSection.style.display = 'block';
      userSection.style.display = 'none';
    }
  }

  updateUI();
  welcomeUser.onclick = () => { window.location.href = 'profile.html'; };
  logoutBtn.onclick = async () => {
    try {
      await fetch('/logout', { method: 'POST' });
      localStorage.clear();
      updateUI();
      alert("Logged out");
    } catch (err) { alert("Error logging out"); }
  };
  loginBtn.onclick  = () => { window.location.href = 'index.html'; };
  signupBtn.onclick = () => { window.location.href = 'index.html'; };

  // ── CHECK OWNER SESSION ──
  async function checkOwnerSession() {
    try {
      const res    = await fetch('/session-owner');
      const result = await res.json();
      if (!res.ok || !result.loggedIn) {
        window.location.href = 'index.html';
        return false;
      }
      // store owner username for sidebar
      if (result.owner?.username) {
        localStorage.setItem('beanthere_owner_username', result.owner.username);
        updateUI();
      }
      return true;
    } catch (err) {
      window.location.href = 'index.html';
      return false;
    }
  }
  async function loadCafeReviews(cafeId) {
    try {
      const response = await fetch(`/reviews-by-cafe/${cafeId}`);
      const reviews = await response.json();

      const container = document.getElementById('reviewsContainer');

      if (!reviews.length) {
        container.innerHTML = `<p style="margin:auto; color:#666;">No reviews for your cafe yet.</p>`;
        document.getElementById('cafeRating').textContent = '—';
        return;
      }

      const avg = (reviews.reduce((sum, r) => sum + (r.rating || 0), 0) / reviews.length).toFixed(1);
      document.getElementById('cafeRating').textContent = avg;

      const review = reviews[0];

      const displayDate =
        review.datePosted && review.datePosted.trim() !== ''
          ? review.datePosted
          : (review.createdAt ? new Date(review.createdAt).toLocaleDateString() : 'No date');

      const beansHtml = getBeanRatingHtml(review.rating);

      const tagsHtml = (review.tags || []).map(tag => {
        const icon = tagIcons[tag];
        return `
          <div class="amenity-item">
            ${icon ? `<img src="${icon}" style="width:14px;height:14px;object-fit:contain;">` : ``}
            <span>${tag}</span>
          </div>
        `;
      }).join('');

      const reviewImage =
        review.photoUrl && review.photoUrl.trim() !== ''
          ? review.photoUrl
          : (review.image ? `/${review.image}` : 'apdev-tbv/cafe4.jpg');

      const replySection = review.ownerReply?.text
        ? `
          <div style="
            margin-top: 12px;
            background: rgba(127,123,46,0.08);
            border-left: 3px solid var(--accent);
            border-radius: 0 10px 10px 0;
            padding: 10px 14px;
            font-size: 13px;
          ">
            <strong style="color:var(--accent);">Your reply</strong>
            <span style="color:#888; font-size:12px; margin-left:8px;">
              ${review.ownerReply.repliedAt ? new Date(review.ownerReply.repliedAt).toLocaleDateString() : ''}
            </span>
            <p style="margin:6px 0 0; color:#4a5568;">${review.ownerReply.text}</p>
          </div>
        `
        : `
          <div class="review-btn-container">
            <button class="btn-reply-review reply-btn" data-id="${review._id}">Reply</button>
          </div>
        `;

      container.innerHTML = `
        <div class="review-card" data-id="${review._id}">
          <div class="review-img">
            <img src="${reviewImage}" alt="${review.establishmentName}">
          </div>

          <div class="review-content">
            <div class="review-top">
              <div class="review-meta">
                <div class="review-user">${review.username}</div>
                <div class="review-date">${displayDate}</div>
              </div>

              <div class="amenities-list">
                ${tagsHtml}
              </div>
            </div>

            <div class="cafe-title-row">
              <h3 class="cafe-name-card">${review.establishmentName}</h3>
              <div class="rating-beans">${beansHtml}</div>
            </div>

            <div class="cafe-address">${review.location || 'Location not available'}</div>

            <div class="review-text">${review.reviewText}</div>

            ${replySection}
          </div>
        </div>
      `;

      const replyBtn = container.querySelector('.reply-btn');
      if (replyBtn) {
        replyBtn.addEventListener('click', () => {
          document.getElementById('replyReviewId').value = replyBtn.dataset.id;
          document.getElementById('replyText').value = '';
          document.getElementById('replyModal').hidden = false;
        });
      }

    } catch (err) {
      console.error(err);
      document.getElementById('reviewsContainer').innerHTML =
        `<p style="margin:auto; color:#666;">Error loading reviews.</p>`;
    }
  }

  

  // ── LOAD CAFE DATA ──
  let currentCafeData = null;

  async function loadOwnerCafe() {
    try {
      const res  = await fetch('/owner-establishment');
      const cafe = await res.json();
      if (!res.ok) { alert(cafe.message || 'Failed to load cafe profile.'); return; }

      currentCafeData = cafe;

      document.getElementById('cafeName').textContent   = cafe.name     || 'Cafe Name';
      document.getElementById('cafeHandle').textContent = cafe.handle   || '';
      document.getElementById('cafeBio').textContent    = cafe.bio      || 'No bio yet.';
      document.getElementById('cafeLocation').textContent = cafe.location || '';

      // photo grid
      const grid   = document.getElementById('cafePhotoGrid');
      const images = Array.isArray(cafe.imageUrl) && cafe.imageUrl.length
        ? cafe.imageUrl
        : ['https://placehold.co/300x160/cfe0ff/6b7280?text=Cafe'];
      grid.innerHTML = images.map(src =>
        `<img src="${src}" alt="${cafe.name}">`
      ).join('');

    } catch (err) {
      console.error(err);
      alert('Error loading cafe profile.');
    }
  }

  // ── LOAD REVIEWS ──
  
  

  // ── EDIT CAFE MODAL ──
  const editCafeBtn    = document.getElementById('editCafeBtn');
  const editCafeModal  = document.getElementById('editCafeModal');
  const editCafeForm   = document.getElementById('editCafeForm');
  const inputCafeBio   = document.getElementById('inputCafeBio');
  const inputCafeImage = document.getElementById('inputCafeImage');

  function openCafeModal() {
    if (!currentCafeData) return;
    inputCafeBio.value = currentCafeData.bio || '';

    const grid   = document.getElementById('cafePhotosGrid');
    const images = Array.isArray(currentCafeData.imageUrl) ? currentCafeData.imageUrl : [];
    grid.innerHTML = images.map(src =>
      `<img src="${src}" style="width:100%; height:70px; object-fit:cover; border-radius:8px; border:1px solid #e6eaea;">`
    ).join('');

    editCafeModal.hidden = false;
  }

  function closeCafeModal() {
    editCafeModal.hidden = true;
    inputCafeImage.value = '';
  }

  document.addEventListener('keydown', e => {
    if (editCafeModal && e.key === 'Escape' && !editCafeModal.hidden) closeCafeModal();
  });

  inputCafeImage.addEventListener('change', function() {
    const files  = Array.from(this.files).slice(0, 5);
    const grid   = document.getElementById('cafePhotosGrid');
    grid.innerHTML = '';
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement('img');
        img.src = e.target.result;
        img.style.cssText = 'width:100%; height:70px; object-fit:cover; border-radius:8px; border:1px solid #e6eaea;';
        grid.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  });

  editCafeForm.addEventListener('submit', async function(e) {
    e.preventDefault();

    const files = Array.from(inputCafeImage.files).slice(0, 5);
    let newImages = null;
    if (files.length > 0) {
      newImages = await Promise.all(files.map(file =>
        new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = ev => resolve(ev.target.result);
          reader.readAsDataURL(file);
        })
      ));
    }

    try {
      const res    = await fetch('/update-cafe', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ bio: inputCafeBio.value.trim(), imageUrl: newImages })
      });
      const result = await res.json();
      if (!res.ok) { alert(result.message || 'Failed to update cafe.'); return; }

      closeCafeModal();
      await loadOwnerCafe();
      alert('Cafe updated successfully!');
    } catch (err) {
      console.error(err);
      alert('Error updating cafe.');
    }
  });
  const tagIcons = {
    "Air-conditioned": "icons/ac.png",
    "Socket": "icons/socket.png",
    "Wi-Fi": "icons/wifi.png",
    "WiFi": "icons/wifi.png",
    "Alt Milk": "icons/oat.png"
  };

  function getBeanRatingHtml(rating) {
    let beansHtml = '';
    for (let i = 0; i < 5; i++) {
      if (i < rating) {
        beansHtml += `<img src="icons/bean.png" style="width:18px;height:18px;">`;
      } else {
        beansHtml += `<img src="icons/bean.png" style="width:18px;height:18px;opacity:0.3;filter:grayscale(1);">`;
      }
    }
    return beansHtml;
  }

  // ── RUN ──
  const ok = await checkOwnerSession();
    if (ok) {
    await loadOwnerCafe();

    editCafeBtn.addEventListener('click', openCafeModal);
    document.querySelectorAll('[data-close-cafe]').forEach(btn => {
      btn.addEventListener('click', closeCafeModal);
    });

    document.querySelectorAll('[data-close-reply]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('replyModal').hidden = true;
      });
    });

    document.getElementById('replyForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const reviewId = document.getElementById('replyReviewId').value;
      const replyText = document.getElementById('replyText').value.trim();

      if (!replyText) {
        alert("Please write a reply.");
        return;
      }

      try {
        const res = await fetch('/reply-review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reviewId, replyText })
        });

        const result = await res.json();

        if (!res.ok) {
          alert(result.message || 'Failed to save reply.');
          return;
        }

        document.getElementById('replyModal').hidden = true;
        await loadCafeReviews(currentCafeData._id);
        alert('Reply saved!');
      } catch (err) {
        console.error(err);
        alert('Error saving reply.');
      }
    });

    if (currentCafeData && currentCafeData._id) {
      await loadCafeReviews(currentCafeData._id);
    }
  }
});

</script>
</body>
</html>
