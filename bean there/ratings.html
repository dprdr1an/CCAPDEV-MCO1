<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bean There – Ratings</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #efe8d6;
      --sidebar: #5b5f10;
      --accent: #7f7b2e;
      --muted: #bfb0a8;
      --content-width: 1500px;
    }

    #viewReviewTitle {
      font-family: Lora, serif;
      font-size: 28px;
      font-weight: 700;
      color: #2b2b2b;
      margin: 0 0 8px;
    }

    #viewReviewMeta {
      font-size: 13px;
      color: #666;
      margin: 0 0 6px;
    }

    .view-review-panel {
      width: min(480px, calc(100% - 32px)) !important;
      max-width: 480px !important;
      text-align: left !important;
    }
    
    @keyframes floatUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-on-load{
      opacity:0;
      animation: floatUp 0.9s ease-out forwards;
    }
    .delay-1{animation-delay:0.15s}
    .delay-2{animation-delay:0.35s}

    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      font-family:Montserrat, system-ui, sans-serif;
      background:var(--bg);
      color:#2b2b2b;
    }

    .frame{
      width:100%;
      height:100vh;
      overflow:hidden;
    }

    .layout{
      display:grid;
      grid-template-columns:260px 1fr;
      height:100%;
      column-gap:18px;
    }

    
    .sidebar{
      background:var(--sidebar);
      color:#fff;
      padding:28px;
      margin:18px 0 18px 18px;
      border-radius:22px;
      height:calc(100% - 36px);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .logo{
      font-family:Lora, serif;
      font-size:42px;
      font-weight:700;
      letter-spacing:1px;
    }

    .nav{
      margin-top:36px;
      display:flex;
      flex-direction:column;
      gap:26px;
    }

    .nav a{
      color:#fff;
      text-decoration:none;
      font-size:20px;
    }

    .auth{
      font-size:20px;
    }

    .sidebar .nav a:hover,
    .sidebar .auth div:hover{
      color:#fa7a11;
      cursor:pointer;
      transition:0.3s;
    }
    
    
    .login-custom-panel {
      max-width: 480px;
      width: 90%;
      border-radius: 20px;
      padding: 40px !important;
    }

    .modal-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 32px;
      text-align: center;
      margin-bottom: 40px;
    }

    .modal-close-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
      color: #333;
    }

    .input-group {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
    }

    .input-group label {
      font-size: 20px;
      min-width: 110px;
    }
    .clickable-user {
  cursor: pointer;
}

.clickable-user:hover {
  text-decoration: underline;
  color: #c0441a;
}

    .input-group input {
      flex: 1;
      padding: 5px;
      border: 0;
      border-bottom: 1px solid #ccc;
      font-size: 18px;
      outline: none;
    }

    .login-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 18px;
    }

    
    .remember-me input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--sidebar);
      cursor: pointer;
    }

    .done-btn {
      padding: 6px 35px;
      border-radius: 25px;
      border: 1.5px solid var(--sidebar);
      background: #fff;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .done-btn:hover {
      background: #f8f8f0;
    }

    .nav a{
      color:#fff;
      text-decoration:none;
      font-size:20px;
    }

    .auth{font-size:20px}

    .sidebar .nav a:hover {
      color: #fa7a11;    
      transition: 0.3s ease;
    }

    .sidebar .auth div:hover {
      color: #fa7a11;
      cursor: pointer;
      transition: 0.3s;
    }

   
    .modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2000; }
    .modal[hidden] { display: none; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.3); }
    .modal-panel { position: relative; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 90%; z-index: 2001; }
  
    .main{
      height:calc(100% - 36px);
      margin:18px 18px 0 0;
      padding:20px 20px;
      border:1.5px solid rgba(127,123,46,0.4);
      border-radius:24px;
      overflow-y:auto;
    }

    .search-wrap{
      display:flex;
      justify-content:center;
    }

    #q{
      font-family:Montserrat, system-ui, sans-serif;
    }

    .search{
      width:100%;
      max-width:var(--content-width);
      height: 50px;
      padding: 0 16px;
      border-radius:40px;
      border:1.5px solid rgba(127,123,46,0.4);
      background:#eee0c5;
      display:flex;
      align-items:center;
    }

    .search input{
      flex:1;
      border:0;
      background:transparent;
      outline:none;
      font-size:18px;
      color:#6d6910;
    }

    .search input::placeholder{
      color:#8a8f7a;
    }

    .search button{
      border:0;
      background:transparent;
      cursor:pointer;
    }

    .search button img{
      width: 18px;
      height: 18px;
      display: block;
    }


    .reviews {
      max-width: var(--content-width);
      margin: 22px auto 0px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .review-card {
      background: #cfe0ff;
      border-radius: 22px;
      padding: 22px;
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 22px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .review-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
    }

    .review-img {
      width: 100%;
      height: 180px;
      border-radius: 16px;
      overflow: hidden;
      background: #dfe8f5;
    }

    .review-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .review-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #253d67;
      opacity: 1; 
    }

    .edited-label {
        font-size: 11px;
        color: #718096;
        font-style: italic;
    }

    .review-title {
      font-family: Lora, serif;
      font-size: 28px;
      color: #d45a2a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .review-location {
      color: #253d67;
      font-size: 15px;
      font-weight: 600;
      margin-top: -8px;
    }

    .review-title-text {
      font-weight: 700;
      font-size: 15px;
      color: #2b2b2b;
      margin-top: 10px;
    }

    .review-tags {
      display: flex;
      gap: 14px;
      font-size: 13px;
      color: #253d67;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tag img {
      width: 14px;
      height: 14px;
    }

    .rating {
      display: inline-flex;
      gap: 4px;
      margin-left: 6px;
    }

    .rating img {
      width: 18px;
      height: 18px;
    }

    .review-text-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .review-text {
      flex: 1;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 4px;
    }

    .review-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .icon-btn img {
      width: 20px;
      height: 20px;
      transition: 0.2s ease;
    }
    .icon-btn:hover img { transform: scale(1.15); }
    .faded { opacity: 0.3; filter: grayscale(1); }
    .active { opacity: 1; filter: none; transform: scale(1.2); }


  
    .sort-bar {
      max-width: var(--content-width);
      margin: 10px auto 6px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    .sort-bar label {
      font-size: 13px;
      font-weight: 600;
      color: #5b5f10;
    }

    .sort-select-wrap {
      display: inline-flex;
      align-items: center;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1.5px solid rgba(127,123,46,0.45);
      background: transparent;
      box-shadow: 0 2px 8px rgba(127,123,46,0.07);
      transition: background 0.2s;
      gap: 6px;
    }

    .sort-select-wrap:hover {
      background: rgba(127,123,46,0.06);
    }

    .sort-select-wrap select {
      border: none;
      background: transparent;
      font-family: Montserrat, system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #4a4a3a;
      cursor: pointer;
      outline: none;
    }

  
    @media(max-width:880px){
      .layout{grid-template-columns:1fr}
      .sidebar{order:2;height:auto}
      .main{order:1}
    }

   
    .auth-panel {
      background-color: #f8f5ee;
      border-radius: 20px;
      padding: 40px 30px;
      width: min(480px, calc(100% - 32px));
      text-align: center;
      border: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    
    .auth-title {
      font-family: 'Lora', serif;
      font-size: 32px;
      font-weight: 700;
      color: #4a3f35;
      margin: 0 0 30px;
      line-height: 1.2;
    }

    
    .auth-group {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 14px 0;
    }

    .auth-group label {
      min-width: 110px;
      font-weight: 700;
      color: #4a3f35;
      text-align: left;
    }

    .auth-group input {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1.5px solid rgba(0,0,0,0.18);
      background: #fff;
      font-size: 15px;
      outline: none;
    }

    
    .auth-btn {
      margin-top: 20px;
      padding: 10px 40px;
      border-radius: 30px;
      border: 2px solid #4a3f35;
      background: transparent;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      color: #4a3f35;
    }

    .auth-btn:hover {
      background: #4a3f35;
      color: #fff;
    }

    .remember-row {
      justify-content: flex-start;
      gap: 8px;
      margin-top: 6px;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      flex: none;
      accent-color: #5b5f10; 
      cursor: pointer;
    }

    .remember-row label {
      min-width: auto;
      font-weight: 500;
      color: #4a3f35;
      cursor: pointer;
    }

    .modal-close-review{
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 28px;
      color: #4a3f35;
      border: none;
      background: transparent;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close-review:hover{
      opacity: 0.7;
    }

    .loading {
      text-align: center;
      font-size: 16px;
      color: #6b7280;
      padding: 40px;
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="layout">

      <aside class="sidebar animate-on-load delay-1">
        <div>
          <div class="logo">bean<br>there</div>
          <nav class="nav">
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="tbv.html">TBV</a>
            <a href="ratings.html">Ratings</a>
          </nav>
        </div>
        <div class="auth" id="authSection">
          <div id="loginBtn" style="margin-bottom:14px">Log in</div>
          <div id="signupBtn">Sign up</div>
        </div>
        <div class="auth" id="userSection" style="display:none;">
          <div id="welcomeUser" style="margin-bottom:14px"></div>
          <div id="logoutBtn">Log out</div>
        </div>
      </aside>

      <main class="main animate-on-load delay-2">
        <div class="search-wrap">
          <div class="search">
            <input id="q" placeholder="Search cafes, owners, tags..." />

              <img src="icons/search.png" alt="search">
            </button>
          </div>
        </div>

        <div class="sort-bar">
          <label for="sortSelect">Sort by</label>

            <select id="sortSelect">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="highest">Highest Rated</option>
              <option value="lowest">Lowest Rated</option>
            </select>
          </div>
        </div>

        <div class="reviews" id="reviewsContainer"></div>
      </main>

    </div>
  </div>
<div id="logInModal" class="modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-backdrop" id="closeLogIn"></div>
  <div class="modal-panel auth-panel">
      <button id="xLogIn" class="modal-close-review">✕</button>
      <h2 class="auth-title">Log in</h2>

      <form id="logInForm">

        <div class="auth-group">
          <label>Username:</label>
          <input id="loginUser" type="text" required>
        </div>

        <div class="auth-group">
          <label>Password:</label>
          <input id="loginPass" type="password" required>
        </div>

        <div class="auth-group remember-row">
          <input type="checkbox" id="rememberMe">

</div>
<div id="signUpModal" class="modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-backdrop" id="closeSignUp"></div>
  <div class="modal-panel auth-panel">
      <button id="xSignUp" class="modal-close-review">✕</button>

      <h2 class="auth-title">Sign Up</h2>

      <form id="signUpForm">

        <div class="auth-group">
          <label>Name:</label>
          <input id="regName" type="text" required>
        </div>

        <div class="auth-group">
          <label>Username:</label>
          <input id="regUser" type="text" required>
        </div>

        <div class="auth-group">
          <label>Password:</label>
          <input id="regPass" type="password" required>
        </div>

        <div class="auth-group">
          <label>Confirm:</label>
          <input id="regConfirm" type="password" required>
        </div>

</div>
<div id="replyModal" class="modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-backdrop" id="closeReplyModal"></div>
  <div class="modal-panel login-custom-panel" style="background:#f8f5ee; border-radius:20px; padding:30px;">
    <button id="xReplyModal" style="position:absolute; top:18px; right:22px; font-size:28px; color:#4a3f35; border:none; background:transparent; cursor:pointer;">✕</button>
    <h3 style="font-family:Lora,serif; font-size:28px; text-align:center; color:#4a3f35; margin:0 0 20px;">Reply to Review</h3>
    <form id="replyForm">
      <input type="hidden" id="replyReviewId">
      <textarea id="replyText" placeholder="Write your reply..." style="width:100%; min-height:120px; border-radius:14px; border:1.5px solid rgba(0,0,0,0.18); padding:14px; font-family:Montserrat,sans-serif; font-size:15px; resize:none;"></textarea>
      <div style="display:flex; justify-content:center; margin-top:18px;">
        <button type="submit" style="background:transparent; color:#4a3f35; border:2px solid #4a3f35; border-radius:30px; padding:10px 50px; font-size:18px; font-weight:700; font-family:Montserrat,sans-serif; cursor:pointer;">Post</button>
      </div>
    </form>
  </div>
</div>
<div id="viewReviewModal" class="modal" hidden>
  <div class="modal-backdrop"></div>

  <div class="modal-panel auth-panel view-review-panel">
    <button id="xViewReview" class="modal-close-review">✕</button>

    <h2 id="viewReviewTitle" style="font-family:Lora,serif;"></h2>

    <p id="viewReviewMeta" style="font-size:13px; color:#666;"></p>

    <p id="viewReviewText" style="margin-top:12px; line-height:1.6; text-align: justify;"></p>
  </div>
</div>
  <script>
  document.addEventListener("DOMContentLoaded", () => {

  
  const logInModal = document.getElementById('logInModal');
  const signUpModal = document.getElementById('signUpModal');
  const logInForm = document.getElementById('logInForm');
  const signUpForm = document.getElementById('signUpForm');

  const loginBtn = document.getElementById('loginBtn');
  const signupBtn = document.getElementById('signupBtn');

  console.log(loginBtn);

  
  const authSection = document.getElementById("authSection");
  const userSection = document.getElementById("userSection");
  const welcomeUser = document.getElementById("welcomeUser");
  const logoutBtn = document.getElementById("logoutBtn");
  
  welcomeUser.onclick = () => {
    window.location.href = "profile.html";
  };

  function updateUI() {
  const ownerUsername = localStorage.getItem("beanthere_owner_username");
  const userUsername = localStorage.getItem("beanthere_profile_username");

  if (ownerUsername) {
    authSection.style.display = "none";
    userSection.style.display = "block";
    welcomeUser.textContent = ownerUsername;
    welcomeUser.onclick = () => {
      window.location.href = "cafeprofile.html";
    };
  } else if (userUsername) {
    authSection.style.display = "none";
    userSection.style.display = "block";
    welcomeUser.textContent = userUsername;
    welcomeUser.onclick = () => {
      window.location.href = "profile.html";
    };
  } else {
    authSection.style.display = "block";
    userSection.style.display = "none";
    welcomeUser.onclick = null;
  }
}

  
  updateUI();

    logoutBtn.onclick = async () => {
  try {
    await fetch('/logout', {
      method: 'POST',
      credentials: 'include'
    });

    localStorage.removeItem('beanthere_owner_username');
    localStorage.removeItem('beanthere_profile_fullname');
    localStorage.removeItem('beanthere_profile_username');
    localStorage.removeItem('beanthere_profile_bio');
    localStorage.removeItem('beanthere_profile_title');
    localStorage.removeItem('beanthere_profile_avatar');

    window.location.href = 'index.html';
  } catch (err) {
    console.error(err);
    alert("Error logging out");
  }
};

  
  loginBtn.onclick = () => logInModal.hidden = false;
  signupBtn.onclick = () => signUpModal.hidden = false;

  document.getElementById('closeLogIn').onclick = () => logInModal.hidden = true;
  document.getElementById('xLogIn').onclick = () => logInModal.hidden = true;
  document.getElementById('closeSignUp').onclick = () => signUpModal.hidden = true;
  document.getElementById('xSignUp').onclick = () => signUpModal.hidden = true;

  function normalizeUsername(username) {
    username = username.trim();
    if (!username.startsWith('@')) {
      username = '@' + username;
    }
    return username;
  }

  function fileToDataURL(file) {
    return new Promise((resolve, reject) => {
      if (!file) {
        resolve("");
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  
  async function checkSessionOnLoad() {
  try {
    const ownerResponse = await fetch('/session-owner', {
      credentials: 'include'
    });

    if (ownerResponse.ok) {
      const ownerResult = await ownerResponse.json();

      if (ownerResult.loggedIn && ownerResult.owner) {
        localStorage.setItem('beanthere_owner_username', ownerResult.owner.username || '');
        localStorage.removeItem('beanthere_profile_fullname');
        localStorage.removeItem('beanthere_profile_username');
        localStorage.removeItem('beanthere_profile_bio');
        localStorage.removeItem('beanthere_profile_title');
        localStorage.removeItem('beanthere_profile_avatar');
        updateUI();
        return;
      }
    }

    const userResponse = await fetch('/session-user', {
      credentials: 'include'
    });

    if (!userResponse.ok) return;

    const userResult = await userResponse.json();
    if (userResult.loggedIn) {
      localStorage.removeItem('beanthere_owner_username');
      localStorage.setItem('beanthere_profile_fullname', userResult.user.fullName || '');
      localStorage.setItem('beanthere_profile_username', userResult.user.username || '');
      localStorage.setItem('beanthere_profile_bio', userResult.user.bio || '');
      localStorage.setItem('beanthere_profile_title', userResult.user.title || 'Member');
      localStorage.setItem('beanthere_profile_avatar', userResult.user.avatar || '');
      updateUI();
    }
  } catch (err) {
    console.error('No active session found.');
  }
}

  checkSessionOnLoad();

  
  logInForm.onsubmit = async function(e) {
  e.preventDefault();

  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  const rememberMe = document.getElementById('rememberMe').checked;

  const normalizedUsername = username.startsWith('@') ? username : '@' + username;

        localStorage.setItem('beanthere_profile_username', result.user.username || '');
        localStorage.setItem('beanthere_profile_bio', result.user.bio || '');

      }
    } else {
      alert(result.message || "Invalid username or password.");
    }
  } catch (err) {
    console.error(err);
    alert("Error connecting to server.");
  }
};

<script>
let allReviews = [];

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-US', {
    month: 'short',
    day: 'numeric',
    year: 'numeric'
  });
}

const tagIcons = {
  "Air-conditioned": "icons/ac.png",
  "Socket": "icons/socket.png",
  "Wi-Fi": "icons/wifi.png",
  "Alt Milk": "icons/oat.png"
};

async function loadReviews() {

  const container = document.getElementById("reviewsContainer");

  container.innerHTML = `<div class="loading">Loading reviews...</div>`;

  try {
    const res = await fetch('/reviews');
    allReviews = await res.json();

    if (!allReviews.length) {
      container.innerHTML = "<p>No reviews yet.</p>";
      return;
    }

    renderReviews(allReviews);

  } catch (err) {
    console.error(err);
    container.innerHTML = "<p>Error loading reviews.</p>";
  }
}

document.addEventListener("DOMContentLoaded", async () => {

  loadReviews();

  document.getElementById('closeReplyModal').onclick = () => document.getElementById('replyModal').hidden = true;
  document.getElementById('xReplyModal').onclick     = () => document.getElementById('replyModal').hidden = true;
  document.getElementById('xViewReview').onclick = () => {
    document.getElementById('viewReviewModal').hidden = true;
  };
});
function renderReviews(data) {
  const container = document.getElementById("reviewsContainer");

  if (!data.length) {
    container.innerHTML = "<p>No reviews found.</p>";
    return;
  }

  const tagIcons = {
    "Air-conditioned": "icons/ac.png",
    "Socket": "icons/socket.png",
    "Wi-Fi": "icons/wifi.png",
    "Alt Milk": "icons/oat.png"
  };

  container.innerHTML = data.map(review => {
    const edited = review.editedAt
      ? ` <span class="edited-label">• edited ${formatDate(review.editedAt)}</span>`
      : '';

    const maxLength = 120;
    const fullText = review.reviewText || '';
    const shortText = fullText.length > maxLength
      ? fullText.substring(0, maxLength) + '...'
      : fullText;

    const beans = Array.from({ length: 5 }, (_, i) => {
      return i < (review.rating || 0)
        ? `<img src="icons/bean.png">`
        : `<img src="icons/bean.png" style="opacity:0.3; filter:grayscale(1)">`;
    }).join("");

    const tags = (review.tags || []).map(tag => {
      const icon = tagIcons[tag];
      return `
        <span class="tag">
          ${icon ? `<img src="${icon}">` : ""}
          ${tag}
        </span>
      `;
    }).join("");

    const currentUser = localStorage.getItem('beanthere_profile_username') || '';
    const isLiked    = (review.likedBy || []).includes(currentUser);
    const isDisliked = (review.dislikedBy || []).includes(currentUser);

    const replies = review.replies || [];

    const previewReplies = replies.slice(0, 2);
    const hasMore = replies.length > 2;

    const repliesHtml = `
      <div class="replies-container" data-id="${review._id}">
        ${previewReplies.map(rep => `
          <div style="
            margin-top: 8px;
            background: rgba(0,0,0,0.04);
            border-left: 4px solid var(--muted);
            border-radius: 0 16px 16px 0;
            padding: 10px 16px;
            font-size: 13px;
          ">
          <strong>
          ${rep.username || 'Anonymous'}
          ${rep.role === "owner" ? `
            <span style="
              background: rgba(91, 95, 16, 0.15);
              color: #5b5f10;
              font-size: 11px;
              padding: 2px 6px;
              border-radius: 10px;
              margin-left: 6px;
              font-weight: 600;
            ">
              Owner
            </span>
          ` : ""}
        </strong>

            <span style="color:#888; font-size:12px; margin-left:8px;">
              ${rep.date || ''}
            </span>

            <p style="margin:6px 0 0; color:#4a5568;">
              ${rep.text || ''}
            </p>
          </div>
        `).join('')}

        ${hasMore ? `
          <button class="see-more-btn" data-id="${review._id}" style="
            margin-top: 8px;
            background: none;
            border: none;
            color: #5b5f10;
            font-weight: 600;
            cursor: pointer;
          ">
            See all ${replies.length} replies
          </button>
        ` : ""}
      </div>
    `;

    return `
      <div class="review-card" data-id="${review._id}">
        <div class="review-img">
          <img src="${review.photoUrl || review.image || 'apdev-tbv/cafe4.jpg'}">
        </div>
        <div class="review-content">
          <div class="review-top">
            <div>
              <strong class="user-link" data-user="${review.username}">
                ${review.username}
              </strong><br>
              ${review.datePosted || ""}${edited}
            </div>
            <div class="review-tags">${tags}</div>
          </div>
          <div class="review-title" style="cursor:pointer;" data-id="${review.establishmentId}">
            ${review.establishmentName || ''}
            <span class="rating">${beans}</span>
          </div>
          <div class="review-location">${review.location || ""}</div>
          <div class="review-title-text">${review.title || 'Untitled Review'}</div>
          <div class="review-text-row">
            <div class="review-text">
              ${shortText}
              ${fullText.length > maxLength ? '<span style="color:#888;"> (See more)</span>' : ''}
            </div>
            <div class="review-actions">
              <div class="icon-btn like-btn">
                <img src="icons/like.png" class="${isLiked ? 'active' : 'faded'}">
                <span>${review.likes || 0}</span>
              </div>
              <div class="icon-btn dislike-btn">
                <img src="icons/dislike.png" class="${isDisliked ? 'active' : 'faded'}">
                <span>${review.dislikes || 0}</span>
              </div>
              <button class="reply-btn" style="
                padding: 6px 20px;
                border-radius: 20px;
                border: 1.5px solid var(--accent);
                background: transparent;
                font-weight: 600;
                font-size: 13px;
                cursor: pointer;
                font-family: Montserrat, sans-serif;
              ">Reply</button>
            </div>
          </div>
        </div>
        ${replies.length > 0 ? `
          <div style="grid-column: 1 / -1;">
            ${repliesHtml}
          </div>
        ` : ''}
      </div>`;
  }).join("");

  document.querySelectorAll('.user-link').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation(); // prevent modal
      const username = el.dataset.user;
      window.location.href = `user.html?username=${encodeURIComponent(username)}`;
    });
  });

  document.querySelectorAll('.review-card').forEach(card => {
    card.addEventListener('click', (e) => {
      // 🚫 IGNORE clicks from buttons/actions
      if (
        e.target.closest('.review-actions') ||
        e.target.closest('.like-btn') ||
        e.target.closest('.dislike-btn') ||
        e.target.closest('.reply-btn') ||
        e.target.closest('.see-more-btn')
      ) {
        return;
      }
      const id = card.dataset.id;
      const review = allReviews.find(r => r._id === id);
      if (!review) return;

      const modal = document.getElementById('viewReviewModal');

      document.getElementById('viewReviewTitle').textContent =
        review.title || 'Untitled Review';

      document.getElementById('viewReviewMeta').textContent =
        `${review.username} • ${review.datePosted || ''}`;

      document.getElementById('viewReviewText').textContent =
        review.reviewText;

      modal.hidden = false;
      });
  });

  document.querySelectorAll('.review-title[data-id]').forEach(el => {
    el.addEventListener('click', () => {
      window.location.href = `cafe.html?id=${el.dataset.id}`;
    });
  });
}
function goToProfile(username) {
  window.location.href = `profile.html?username=${username}`;
}

const searchInput = document.getElementById("q");
const searchBtn = document.getElementById("searchBtn");

const sortSelect = document.getElementById("sortSelect");

function sortReviews(list) {
  const sorted = [...list];
  const val = sortSelect.value;
  if (val === "newest") {
    sorted.sort((a, b) => new Date(b.datePosted || 0) - new Date(a.datePosted || 0));
  } else if (val === "oldest") {
    sorted.sort((a, b) => new Date(a.datePosted || 0) - new Date(b.datePosted || 0));
  } else if (val === "highest") {
    sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  } else if (val === "lowest") {
    sorted.sort((a, b) => (a.rating || 0) - (b.rating || 0));
  }
  return sorted;
}

function handleSearch() {
  const query = searchInput.value.toLowerCase().trim();

  let results = allReviews;

  if (query) {
    results = allReviews.filter(review => {
      return (
        review.establishmentName?.toLowerCase().includes(query) ||
        review.username?.toLowerCase().includes(query) ||
        review.reviewText?.toLowerCase().includes(query) ||
        review.location?.toLowerCase().includes(query) ||
        (review.tags || []).some(tag =>
          tag.toLowerCase().includes(query)
        )
      );
    });
  }

  renderReviews(sortReviews(results));
}

searchBtn.addEventListener("click", handleSearch);

searchInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleSearch();
});

searchInput.addEventListener("input", handleSearch);

sortSelect.addEventListener("change", handleSearch);

function requireLogin() {
  const user = localStorage.getItem("beanthere_profile_username");
  if (!user) {
    alert("Please log in or create an account first.");
    return false;
  }
  return true;
}

document.addEventListener("click", function(e) {
  const likeBtn    = e.target.closest(".like-btn");
  const dislikeBtn = e.target.closest(".dislike-btn");
  const replyBtn   = e.target.closest(".reply-btn");

  if (likeBtn) {
    e.stopPropagation();
    if (!requireLogin()) return;
    const card = likeBtn.closest(".review-card");
    const reviewId = card.dataset.id;
    fetch(`/reviews/${reviewId}/like`, {
  method: "POST",
  credentials: "include"
});
    const likeImg = likeBtn.querySelector("img");
    const likeCount = likeBtn.querySelector("span");
    const dislikeBtnEl = likeBtn.parentElement.querySelector(".dislike-btn");
    const dislikeImg = dislikeBtnEl.querySelector("img");
    const dislikeCount = dislikeBtnEl.querySelector("span");
    const wasLiked = likeImg.classList.contains("active");
    const wasDisliked = dislikeImg.classList.contains("active");
    if (wasDisliked) {
      dislikeImg.classList.remove("active"); dislikeImg.classList.add("faded");
      dislikeCount.textContent = Math.max(0, parseInt(dislikeCount.textContent) - 1);
    }
    if (!wasLiked) {
      likeImg.classList.remove("faded"); likeImg.classList.add("active");
      likeCount.textContent = parseInt(likeCount.textContent) + 1;
    } else {
      likeImg.classList.remove("active"); likeImg.classList.add("faded");
      likeCount.textContent = Math.max(0, parseInt(likeCount.textContent) - 1);
    }
  }

  if (dislikeBtn) {
    e.stopPropagation();
    if (!requireLogin()) return;
    const card = dislikeBtn.closest(".review-card");
    const reviewId = card.dataset.id;
    fetch(`/reviews/${reviewId}/dislike`, {
  method: "POST",
  credentials: "include"
});
    const dislikeImg = dislikeBtn.querySelector("img");
    const dislikeCount = dislikeBtn.querySelector("span");
    const likeBtnEl = dislikeBtn.parentElement.querySelector(".like-btn");
    const likeImg = likeBtnEl.querySelector("img");
    const likeCount = likeBtnEl.querySelector("span");
    const wasDisliked = dislikeImg.classList.contains("active");
    const wasLiked = likeImg.classList.contains("active");
    if (wasLiked) {
      likeImg.classList.remove("active"); likeImg.classList.add("faded");
      likeCount.textContent = Math.max(0, parseInt(likeCount.textContent) - 1);
    }
    if (!wasDisliked) {
      dislikeImg.classList.remove("faded"); dislikeImg.classList.add("active");
      dislikeCount.textContent = parseInt(dislikeCount.textContent) + 1;
    } else {
      dislikeImg.classList.remove("active"); dislikeImg.classList.add("faded");
      dislikeCount.textContent = Math.max(0, parseInt(dislikeCount.textContent) - 1);
    }
  }

  if (replyBtn) {
    e.stopPropagation();
    if (!requireLogin()) return;
    const card = replyBtn.closest(".review-card");
    document.getElementById('replyReviewId').value = card.dataset.id;
    document.getElementById('replyText').value = '';
    document.getElementById('replyModal').hidden = false;
  }
});

document.getElementById('replyForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const reviewId = document.getElementById('replyReviewId').value;
  const text     = document.getElementById('replyText').value.trim();
  if (!text) { alert("Please write a reply."); return; }

  try {
    const res = await fetch(`/reviews/${reviewId}/reply`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });

    if (!res.ok) { alert("Error posting reply."); return; }

    document.getElementById('replyModal').hidden = true;

    
    await loadReviews();

  } catch (err) {
    alert("Error posting reply.");
  }
});

document.addEventListener("click", function(e) {
  if (e.target.classList.contains("see-more-btn")) {
    e.stopPropagation();
    const reviewId = e.target.dataset.id;

    const review = allReviews.find(r => r._id === reviewId); 
    if (!review) return;

    const fullReplies = (review.replies || []).map(rep => `
      <div style="
        margin-top: 8px;
        background: rgba(0,0,0,0.04);
        border-left: 4px solid var(--muted);
        border-radius: 0 16px 16px 0;
        padding: 10px 16px;
        font-size: 13px;
      ">
        <strong>
          ${rep.username || 'Anonymous'}
          ${rep.role === "owner" ? `
            <span style="
              background: rgba(91, 95, 16, 0.15);
              color: #5b5f10;
              font-size: 11px;
              padding: 2px 6px;
              border-radius: 10px;
              margin-left: 6px;
              font-weight: 600;
            ">
              Owner
            </span>
          ` : ""}
        </strong>

        <span style="color:#888; font-size:12px; margin-left:8px;">
          ${rep.date || ''}
        </span>

        <p style="margin:6px 0 0; color:#4a5568;">
          ${rep.text || ''}
        </p>
      </div>
    `).join('');

    const container = document.querySelector(
      `.replies-container[data-id="${reviewId}"]`
    );

    if (!container) return;

    container.innerHTML = fullReplies;
  }
});
</script>
