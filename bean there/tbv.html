<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bean There - TBV</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #efe8d6;
      --sidebar: #5b5f10;
      --accent: #7f7b2e;
      --hero: #3e2b20;
      --card-blue: #c6d9ff;
      --muted: #bfb0a8;

      --rounded: 22px;
      --gap: 28px;

      --content-width: 1500px;
    }

    /* animation */
    @keyframes floatUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-on-load{
      opacity:0;
      animation: floatUp 0.9s ease-out forwards;
    }
    .delay-1{animation-delay:0.15s}
    .delay-2{animation-delay:0.35s}

    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      font-family:Montserrat, system-ui, sans-serif;
      background:var(--bg);
      color:#2b2b2b;
    }

    /* reusable alignment class */
    .content-section{
      max-width: var(--content-width);
      margin-left: auto;
      margin-right: auto;
    }

    .frame{
      width:100%;
      height:100vh;
      overflow:hidden;
    }

    .layout{
      display:grid;
      grid-template-columns:260px 1fr;
      height:100%;
      column-gap:18px;
    }

    /* SIDEBAR */
    .sidebar{
      background:var(--sidebar);
      color:#fff;
      padding:28px;
      margin:18px 0 18px 18px;
      border-radius:22px;
      height:calc(100% - 36px);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .logo{
      font-family:Lora, serif;
      font-size:42px;
      font-weight:700;
      letter-spacing:1px;
    }

    .nav{
      margin-top:36px;
      display:flex;
      flex-direction:column;
      gap:26px;
    }

    .nav a{
      color:#fff;
      text-decoration:none;
      font-size:20px;
    }

    .auth{font-size:20px}

    .sidebar .nav a:hover {
      color: #fa7a11;
      transition: 0.3s ease;
    }

    .sidebar .auth div:hover {
      color: #fa7a11;
      cursor: pointer;
      transition: 0.3s;
    }

    /* Custom Login Modal Styles */
    .login-custom-panel {
      max-width: 480px;
      width: 90%;
      border-radius: 20px;
      padding: 40px !important;
    }

    .modal-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 32px;
      text-align: center;
      margin-bottom: 40px;
    }

    .modal-close-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
      color: #333;
    }

    .input-group {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
    }

    .input-group label {
      font-size: 20px;
      min-width: 110px;
    }

    .input-group input {
      flex: 1;
      padding: 5px;
      border: 0;
      border-bottom: 1px solid #ccc;
      font-size: 18px;
      outline: none;
    }

    .login-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 18px;
    }

    .remember-me input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--sidebar);
      cursor: pointer;
    }

    .done-btn {
      padding: 6px 35px;
      border-radius: 25px;
      border: 1.5px solid var(--sidebar);
      background: #fff;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .done-btn:hover {
      background: #f8f8f0;
    }

    .nav a{
      color:#fff;
      text-decoration:none;
      font-size:20px;
    }

    .auth{font-size:20px}

    .sidebar .nav a:hover {
      color: #fa7a11;
      transition: 0.3s ease;
    }

    .sidebar .auth div:hover {
      color: #fa7a11;
      cursor: pointer;
      transition: 0.3s;
    }

    /* Modal Styles */
    .modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2000; }
    .modal[hidden] { display: none; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.3); }
    .modal-panel { position: relative; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 90%; z-index: 2001; }

    /* MAIN */
    .main{
      height:calc(100% - 36px);
      overflow-y:auto;
      margin:18px 18px 0 0;
      padding:32px 16px;
      border:1.5px solid rgba(127,123,46,0.4);
      border-radius:24px;
    }

    /* SEARCH */
    .search-wrap{
      display:flex;
      justify-content:center;
    }

    .search{
      width:100%;
      max-width:var(--content-width);
      height: 50px;
      padding: 0 16px;
      border-radius:40px;
      border:1.5px solid rgba(127,123,46,0.4);
      background:#eee0c5;
      display:flex;
      align-items:center;
      margin-top: 18px;
    }

    .search input{
      flex:1;
      border:0;
      background:transparent;
      outline:none;
      font-size:18px;
      color:#6d6910;
    }

    .search input::placeholder{
      color:#8a8f7a;
    }

    .search button{
      border:0;
      background:transparent;
      cursor:pointer;
    }

    .search button img{
      width:18px;
      height:18px;
      display:block;
    }

    #q {
      font-family: Montserrat, system-ui, sans-serif;
    }

    /* ===== TBV PAGE STYLES ===== */

    .section-title{
      font-family: Lora, serif;
      font-size: 44px;
      margin: 26px 0 14px;
      color:#24335c;
    }

    /* Recently Added */
    .recent{
      max-width: var(--content-width);
      margin: 0 auto 8px;
      background:#a43b1b;
      border-radius: 18px;
      padding: 18px;
    }
    .recent h2{
      font-family: Lora, serif;
      font-size: 44px;
      margin: 0 0 14px;
      color:#fff;
    }
    .recent-grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    /* empty block inside recent-grid */
    .recent-grid .empty-block{
      min-height: 160px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .recent-card{
      position:relative;
      border-radius: 14px;
      overflow:hidden;
      height: 190px;
      background:#fff;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .recent-card img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition: transform .35s ease, filter .35s ease;
    }
    .recent-overlay{
      position:absolute;
      left:0; right:0; bottom:0;
      padding: 10px 12px;
      color:#fff;
      background: linear-gradient(transparent, rgba(0,0,0,0.55));
      transition: transform .25s ease, opacity .25s ease;
    }
    .recent-overlay .name{
      font-weight:700;
      font-size: 16px;
      line-height: 1.1;
    }
    .recent-overlay .loc{
      opacity:0.9;
      font-size: 13px;
      margin-top: 2px;
    }
    .recent-card:hover{
      transform: translateY(-6px);
      box-shadow: 0 14px 28px rgba(0,0,0,.25);
    }
    .recent-card:hover img{
      transform: scale(1.06);
      filter: saturate(1.1) contrast(1.05);
    }
    .recent-card:hover .recent-overlay{
      transform: translateY(-4px);
    }

    /* Top Cities */
    .cities-grid{
      max-width: var(--content-width);
      margin: 0 auto;
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }
    .city-card{
      background:#1f3b64;
      border-radius: 22px;
      padding: 18px;
      height: 270px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      overflow:hidden;
    }

    .city-photo{
      position: relative;
      height: 175px;
      border-radius: 18px;
      background: transparent;
      overflow: hidden; /* clips single images to border-radius */
    }

    /* single image inside city-photo (non-stacked) */
    .city-photo img:not(.p){
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 18px;
    }

    /* city photos stack animation */
    .city-photo.stack{
      position: relative;
      height: 185px;
      border-radius: 14px;
      overflow: visible; /* important so the tilt can stick out */
      background: transparent;
    }

    /* the 3 stacked images */
    .city-photo.stack .p{
      position: absolute;
      left: 50%;
      top: 8px;
      width: 92%;
      height: 185px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      transform: translateX(-50%);
    }

    /* default look (not hovered) */
    .city-photo.stack .back{
      transform: translateX(-50%) rotate(-10deg);
      opacity: 0.35;
      filter: saturate(0.95);
    }
    .city-photo.stack .mid{
      transform: translateX(-50%) rotate(8deg);
      opacity: 0.55;
    }
    .city-photo.stack .front{
      transform: translateX(-50%) rotate(0deg);
      opacity: 1;
    }

    @keyframes fadeFront3 {
      0%, 32%   { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
    @keyframes fadeMid3 {
      0%, 32%   { opacity: 0; }
      33%, 65%  { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes fadeBack3 {
      0%, 65%   { opacity: 0; }
      66%, 100% { opacity: 1; }
    }
    @keyframes turnCycle {
      0%   { transform: translateX(-50%) rotate(0deg) rotateY(0deg); }
      35%  { transform: translateX(-50%) rotate(0deg) rotateY(18deg); }
      70%  { transform: translateX(-50%) rotate(0deg) rotateY(-16deg); }
      100% { transform: translateX(-50%) rotate(0deg) rotateY(0deg); }
    }

    .city-card:hover .city-photo.stack .front{
      animation: turnCycle 1.2s ease-in-out infinite, fadeFront3 3s ease-in-out infinite;
    }
    .city-card:hover .city-photo.stack .mid{
      animation: fadeMid3 3s ease-in-out infinite;
    }
    .city-card:hover .city-photo.stack .back{
      animation: fadeBack3 3s ease-in-out infinite;
    }
    .city-card:hover .city-photo.stack .mid{
      transform: translateX(-50%) rotate(8deg);
    }
    .city-card:hover .city-photo.stack .back{
      transform: translateX(-50%) rotate(-10deg);
    }

    .city-name{
      text-align:center;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: 0.01px;
      color: #a7bde7;
      margin-top: 10px;
    }

    /* NEW — cafe count under city name */
    .city-count{
      text-align: center;
      color: #dbe6ff;
      font-size: 14px;
      margin-top: 4px;
    }

    /* All Listed TBVs */
    .sub-title{
      font-family: Lora, serif;
      font-size: 44px;
      margin: 14px 0 12px;
      color:#4a4a3a;
    }

    .tbv-grid{
      max-width: var(--content-width);
      margin: 0 auto 22px;
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .tbv-card{
      background:#c7b073;
      border-radius: 16px;
      padding: 10px;
      display:flex;
      gap: 10px;
      align-items:stretch;
      border: 1.5px solid rgba(127,123,46,0.25);
      min-height: 130px;
      cursor: pointer;
      transition: transform .22s ease, box-shadow .22s ease, filter .22s ease;
    }

    .tbv-thumb{
      flex: 0 0 50%;
      height: 130px;
      border-radius: 12px;
      overflow:hidden;
      background:#fff;
      transition: transform .35s ease, filter .35s ease;
    }

    .tbv-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .tbv-info{
      flex: 1 1 50%;
      min-width:0;
      display:grid;
      grid-template-rows: 1fr auto;
      row-gap: 18px;
    }

    .tbv-bottom{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 10px;
      margin-top: 6px;
    }

    .tbv-name{
      font-weight: 800;
      font-size: 22px;
      color:#2b210c;
      margin: 0;
      line-height: 1.05;
    }

    .tbv-loc{
      font-size: 13px;
      color: #524936;
      margin-top: 3px;
    }

    .tbv-beans-row{
      display:flex;
      align-items:center;
      gap: 6px;
      margin-top: 10px;
    }

    .tbv-beans{
      display:flex;
      align-items:center;
      gap: 6px;
    }

    .tbv-beans img{
      width: 16px;
      height: 16px;
      object-fit:contain;
      display:block;
    }

    .tbv-half{
      font-size: 13px;
      font-weight: 450;
      color: #3a2a14;
    }

    .tbv-inclusions{
      justify-self: end;
      align-self: end;
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.35);
      transition: transform .22s ease, background .22s ease;
    }

    .tbv-inclusions img{
      width: 16px;
      height: 16px;
      object-fit:contain;
      display:block;
    }

    /* Card hover effects */
    .tbv-card:hover{
      transform: translateY(-6px);
      box-shadow: 0 16px 28px rgba(0,0,0,0.18);
    }

    .tbv-card:hover .tbv-thumb img{
      transform: scale(1.06);
      filter: saturate(1.1) contrast(1.05);
    }

    .tbv-card:hover .tbv-inclusions{
      transform: translateY(-2px);
      background: rgba(255,255,255,0.55);
    }

    .tbv-card:focus-within{
      outline: 2px solid rgba(127,123,46,0.55);
      outline-offset: 3px;
    }

    /* ===== FILTER BAR ===== */
    .tbv-filterbar{
      margin: 12px auto 14px;
      padding: 14px 14px 12px;
      border-radius: 18px;
      border: 1.5px solid rgba(127,123,46,0.25);
      background: rgba(199,176,115,0.28);
    }

    .tbv-filter-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .tbv-filter-title{
      font-family: Lora, serif;
      font-size: 22px;
      color:#4a4a3a;
    }

    .tbv-sort{
      display:flex;
      align-items:center;
      gap: 10px;
      position: relative;
    }

    .tbv-sort-label{
      font-size: 14px;
      color:#4a4a3a;
      font-weight: 600;
    }

    .tbv-sort-select{
      appearance: none;
      padding: 7px 34px 7px 10px;
      border-radius: 999px;
      border: 1.5px solid rgba(127,123,46,0.35);
      background: rgba(255,255,255,0.45);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .tbv-sort::after{
      content:"▾";
      position:absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-45%);
      pointer-events:none;
      color:#4a4a3a;
      font-size: 13px;
    }

    .tbv-filter-groups{
      display:flex;
      flex-direction:column;
      gap: 12px;
    }

    .tbv-filter-group{
      display:flex;
      align-items:flex-start;
      gap: 12px;
    }

    .tbv-filter-label{
      width: 140px;
      flex: 0 0 140px;
      font-weight: 700;
      color:#4a4a3a;
      font-size: 14px;
      padding-top: 8px;
    }

    .tbv-filter-pills{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      cursor:pointer;
      user-select:none;
    }

    .pill input{
      position:absolute;
      opacity:0;
      pointer-events:none;
    }

    .pill span{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1.5px solid rgba(127,123,46,0.35);
      background: rgba(255,255,255,0.35);
      color:#3a2a14;
      font-size: 13px;
      font-weight: 600;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .pill:hover span{
      transform: translateY(-1px);
      background: rgba(255,255,255,0.50);
    }

    .pill input:checked + span{
      background: rgba(255,255,255,0.75);
      border-color: rgba(127,123,46,0.65);
      box-shadow: 0 10px 18px rgba(0,0,0,0.10);
    }

    .pill-icon img{
      width: 16px;
      height: 16px;
      object-fit: contain;
      display:block;
    }

    .tbv-filter-actions{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-top: 12px;
    }

    .tbv-filter-btn{
      border: 1.5px solid rgba(127,123,46,0.35);
      background: rgba(255,255,255,0.40);
      padding: 6px 12px;
      border-radius: 999px;
      cursor:pointer;
      font-weight: 700;
      font-size: 13px;
      color:#4a4a3a;
      transition: transform .18s ease, background .18s ease;
    }

    .tbv-filter-btn:hover{
      background: rgba(255,255,255,0.55);
      transform: translateY(-1px);
    }

    .tbv-filter-hint{
      font-size: 12px;
      color: rgba(74,74,58,0.85);
    }

    /* ===== EMPTY STATES ===== */
    .empty-block{
      border: 1.5px dashed rgba(255,255,255,0.35);
      border-radius: 16px;
      padding: 28px 18px;
      text-align:center;
      color:#fff;
      background: rgba(255,255,255,0.08);
    }

    .empty-block.dark{
      color:#4a4a3a;
      border-color: rgba(127,123,46,0.35);
      background: rgba(255,255,255,0.35);
    }

    .empty-block h3{
      margin:0 0 8px;
      font-family:Lora, serif;
      font-size:28px;
    }

    .empty-block p{
      margin:0;
      font-size:15px;
    }

    .empty-tbv{
      grid-column: 1 / -1;
      background: rgba(255,255,255,0.35);
      border: 1.5px dashed rgba(127,123,46,0.35);
      border-radius: 18px;
      padding: 36px 22px;
      text-align: center;
      color: #4a4a3a;
    }

    .empty-tbv h3{
      margin: 0 0 10px;
      font-family: Lora, serif;
      font-size: 30px;
    }

    .empty-tbv p{
      margin: 0 0 18px;
      font-size: 15px;
    }

    .empty-btn{
      border: 1.5px solid rgba(127,123,46,0.45);
      background: rgba(255,255,255,0.55);
      padding: 10px 16px;
      border-radius: 999px;
      cursor:pointer;
      font-weight: 700;
      color: #4a4a3a;
      font-family: Montserrat, system-ui, sans-serif;
      transition: background .18s ease;
    }

    .empty-btn:hover{
      background: rgba(255,255,255,0.80);
    }

    /* ===== REMOVE BUTTON ===== */
    .remove-btn{
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0;
      opacity: 0.7;
      transition: opacity .2s ease, transform .2s ease;
    }

    .remove-btn:hover{
      opacity: 1;
      transform: scale(1.15);
    }

    /* MOBILE */
    @media(max-width:1100px){
      .recent-grid{ grid-template-columns: repeat(2, 1fr); }
      .cities-grid{ grid-template-columns: 1fr; }
      .tbv-grid{ grid-template-columns: repeat(2, 1fr); }
    }

    @media(max-width:980px){
      .tbv-filter-group{ flex-direction:column; gap: 8px; }
      .tbv-filter-label{ width:auto; flex: none; padding-top: 0; }
      .tbv-filter-top{ flex-direction:column; align-items:flex-start; }
    }

    @media(max-width:880px){
      .layout{grid-template-columns:1fr}
      .sidebar{order:2;height:auto}
      .main{order:1}
      .tbv-grid{ grid-template-columns: 1fr; }
      .recent-grid{ grid-template-columns: 1fr; }
    }

    /* ===== UNIFIED AUTH MODAL STYLE ===== */
    .auth-panel {
      background-color: #f8f5ee;
      border-radius: 20px;
      padding: 40px 30px;
      width: min(480px, calc(100% - 32px));
      text-align: center;
      border: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .auth-title {
      font-family: 'Lora', serif;
      font-size: 32px;
      font-weight: 700;
      color: #4a3f35;
      margin: 0 0 30px;
      line-height: 1.2;
    }

    .auth-group {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 14px 0;
    }

    .auth-group label {
      min-width: 110px;
      font-weight: 700;
      color: #4a3f35;
      text-align: left;
    }

    .auth-group input {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1.5px solid rgba(0,0,0,0.18);
      background: #fff;
      font-size: 15px;
      outline: none;
    }

    .auth-btn {
      margin-top: 20px;
      padding: 10px 40px;
      border-radius: 30px;
      border: 2px solid #4a3f35;
      background: transparent;
      font-size: 18px;
      font-weight: 700;

  <!-- ═══════════════ SCRIPT 1 — AUTH ═══════════════
       Preserved exactly from original, with two changes:
       1. Fake alert-based search handler removed
       2. TBV wire-up + loadTBV() call added at end of DOMContentLoaded
  ════════════════════════════════════════════════════ -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      // --- 1. SELECTORS ---
      const logInModal  = document.getElementById('logInModal');
      const signUpModal = document.getElementById('signUpModal');
      const logInForm   = document.getElementById('logInForm');
      const signUpForm  = document.getElementById('signUpForm');

      const loginBtn  = document.getElementById('loginBtn');
      const signupBtn = document.getElementById('signupBtn');

      const tbvMessage = document.getElementById("tbvMessage");
      const tbvContent = document.getElementById("tbvContent");

      // --- AUTH UI ---
      const authSection = document.getElementById("authSection");
      const userSection = document.getElementById("userSection");
      const welcomeUser = document.getElementById("welcomeUser");
      const logoutBtn   = document.getElementById("logoutBtn");

      welcomeUser.onclick = () => {
        window.location.href = "profile.html";
      };

      function updateUI() {
        const ownerUsername = localStorage.getItem("beanthere_owner_username");
        const userUsername  = localStorage.getItem("beanthere_profile_username");

        if (ownerUsername) {
          authSection.style.display = "none";
          userSection.style.display = "block";
          welcomeUser.textContent = ownerUsername;
          welcomeUser.onclick = () => {
            window.location.href = "cafeprofile.html";
          };
          tbvMessage.style.display = "none";
          tbvContent.style.display = "block";
        } else if (userUsername) {
          authSection.style.display = "none";
          userSection.style.display = "block";
          welcomeUser.textContent = userUsername;
          welcomeUser.onclick = () => {
            window.location.href = "profile.html";
          };
          tbvMessage.style.display = "none";
          tbvContent.style.display = "block";
        } else {
          authSection.style.display = "block";
          userSection.style.display = "none";
          welcomeUser.onclick = null;
          tbvMessage.style.display = "block";
          tbvContent.style.display = "none";
        }
      }

      // run on load
      updateUI();

      logoutBtn.onclick = async () => {
        try {
          await fetch('/logout', {
            method: 'POST',
            credentials: 'include'
          });

          localStorage.removeItem('beanthere_owner_username');
          localStorage.removeItem('beanthere_profile_fullname');
          localStorage.removeItem('beanthere_profile_username');
          localStorage.removeItem('beanthere_profile_bio');
          localStorage.removeItem('beanthere_profile_title');
          localStorage.removeItem('beanthere_profile_avatar');

          window.location.href = 'index.html';
        } catch (err) {
          console.error(err);
          alert("Error logging out");
        }
      };

      // --- 2. MODAL CONTROLS ---
      loginBtn.onclick  = () => { logInModal.hidden  = false; };
      signupBtn.onclick = () => { signUpModal.hidden = false; };

      document.getElementById('closeLogIn').onclick  = () => { logInModal.hidden  = true; };
      document.getElementById('xLogIn').onclick      = () => { logInModal.hidden  = true; };
      document.getElementById('closeSignUp').onclick = () => { signUpModal.hidden = true; };
      document.getElementById('xSignUp').onclick     = () => { signUpModal.hidden = true; };

      function normalizeUsername(username) {
        username = username.trim();
        if (!username.startsWith('@')) {
          username = '@' + username;
        }
        return username;
      }

      function fileToDataURL(file) {
        return new Promise((resolve, reject) => {
          if (!file) {
            resolve("");
            return;
          }
          const reader = new FileReader();
          reader.onload  = (e) => resolve(e.target.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      // --- 3. CHECK EXISTING SESSION ---
      async function checkSessionOnLoad() {
        try {
          const ownerResponse = await fetch('/session-owner', {
            credentials: 'include'
          });

          if (ownerResponse.ok) {
            const ownerResult = await ownerResponse.json();

            if (ownerResult.loggedIn && ownerResult.owner) {
              localStorage.setItem('beanthere_owner_username', ownerResult.owner.username || '');
              localStorage.removeItem('beanthere_profile_fullname');
              localStorage.removeItem('beanthere_profile_username');
              localStorage.removeItem('beanthere_profile_bio');
              localStorage.removeItem('beanthere_profile_title');
              localStorage.removeItem('beanthere_profile_avatar');
              updateUI();
              loadTBV();
              return;
            }
          }

          const userResponse = await fetch('/session-user', {
            credentials: 'include'
          });

          if (!userResponse.ok) return;

          const userResult = await userResponse.json();
          if (userResult.loggedIn) {
            localStorage.removeItem('beanthere_owner_username');
            localStorage.setItem('beanthere_profile_fullname', userResult.user.fullName || '');
            localStorage.setItem('beanthere_profile_username', userResult.user.username  || '');
            localStorage.setItem('beanthere_profile_bio',      userResult.user.bio       || '');
            localStorage.setItem('beanthere_profile_title',    userResult.user.title     || 'Member');
            localStorage.setItem('beanthere_profile_avatar',   userResult.user.avatar    || '');
            updateUI();
            loadTBV();
          }
        } catch (err) {
          console.error('No active session found.');
        }
      }

      checkSessionOnLoad();

      // --- 4. LOGIN HANDLER ---
      logInForm.onsubmit = async function(e) {
        e.preventDefault();

        const username   = document.getElementById('loginUser').value.trim();
        const password   = document.getElementById('loginPass').value.trim();
        const rememberMe = document.getElementById('rememberMe').checked;

        const normalizedUsername = username.startsWith('@') ? username : '@' + username;

        if (!/^@[A-Za-z0-9_]{3,20}$/.test(normalizedUsername)) {
          alert("Please enter a valid username.");
          return;
        }

        if (password.length < 6 || password.length > 50) {
          alert("Password must be 6 to 50 characters.");
          return;
        }

        try {
          const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ username, password, rememberMe })
          });

          const result = await response.json();

          if (response.ok) {
            if (result.role === "owner") {
              localStorage.setItem('beanthere_owner_username', result.username || normalizedUsername);
              localStorage.removeItem('beanthere_profile_fullname');
              localStorage.removeItem('beanthere_profile_username');
              localStorage.removeItem('beanthere_profile_bio');
              localStorage.removeItem('beanthere_profile_title');
              localStorage.removeItem('beanthere_profile_avatar');

              updateUI();
              alert("Owner login successful!");
              window.location.href = 'cafeprofile.html';
            } else {
              localStorage.removeItem('beanthere_owner_username');
              localStorage.setItem('beanthere_profile_fullname', result.user.fullName || '');
              localStorage.setItem('beanthere_profile_username', result.user.username  || '');
              localStorage.setItem('beanthere_profile_bio',      result.user.bio       || '');
              localStorage.setItem('beanthere_profile_title',    result.user.title     || 'Member');
              localStorage.setItem('beanthere_profile_avatar',   result.user.avatar    || '');

              updateUI();
              logInModal.hidden = true;
              loadTBV();
              alert("Login successful! Welcome back.");
            }
          } else {
            alert(result.message || "Invalid username or password.");
          }
        } catch (err) {
          console.error(err);
          alert("Error connecting to server.");
        }
      };

      // --- 5. SIGNUP HANDLER ---
      signUpForm.onsubmit = async function(e) {
        e.preventDefault();

        const fullName   = document.getElementById('regName').value.trim();
        const username   = normalizeUsername(document.getElementById('regUser').value);
        const password   = document.getElementById('regPass').value;
        const confirm    = document.getElementById('regConfirm').value;
        const bio        = document.getElementById('regBio').value.trim()   || "No bio added yet.";
        const title      = document.getElementById('regTitle').value.trim() || "Member";
        const avatarFile = document.getElementById('regAvatar').files[0];

        if (fullName.length < 2 || fullName.length > 60) {
          alert("Full name must be 2 to 60 characters.");
          return;
        }
        if (!/^@[A-Za-z0-9_]{3,20}$/.test(username)) {
          alert("Username must start with @ and be 3 to 20 characters using only letters, numbers, and underscores.");
          return;
        }
        if (password.length < 6 || password.length > 50) {
          alert("Password must be 6 to 50 characters.");
          return;
        }
        if (bio.length > 160) {
          alert("Bio must be 160 characters or less.");
          return;
        }
        if (title.length > 50) {
          alert("Job title must be 50 characters or less.");
          return;
        }
        if (password !== confirm) {
          alert("Passwords do not match!");
          return;
        }

        try {
          const avatar = await fileToDataURL(avatarFile);

          const response = await fetch('/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName, username, password, bio, title, avatar })
          });

          const result = await response.text();

          if (response.ok) {
            alert("Signup successful! You can now log in.");
            signUpForm.reset();
            signUpModal.hidden = true;
            logInModal.hidden  = false;
          } else {
            alert(result);
          }
        } catch (err) {
          console.error(err);
          alert("Error connecting to server.");
        }
      };

      // --- 6. WIRE UP SEARCH & TBV LOAD ---
      document.getElementById("searchBtn").addEventListener("click", filterTBV);
      document.getElementById("q").addEventListener("input", filterTBV);

      document.getElementById("clearSearchBtn").addEventListener("click", () => {
        document.getElementById("q").value = "";
        filterTBV();
      });

      document.getElementById("sortSelect").addEventListener("change", filterTBV);

    }); // end DOMContentLoaded
  </script>


  <!-- ═══════════════ SCRIPT 2 — TBV DATA ═══════════════
       All functions are global so they are accessible from
       both the DOMContentLoaded callback above and from
       onclick handlers on dynamically generated cards.
  ════════════════════════════════════════════════════════ -->
  <script>
    /* ── STATE ──────────────────────────────────────────── */
    let allTbvCafes = [];   // master list from backend

    /* ── HELPERS ────────────────────────────────────────── */

    /**
     * Returns the best available image URL from a cafe object.
     * Falls back to a placeholder if nothing is found.
     */
    function getImageSrc(cafe) {
      if (Array.isArray(cafe.imageUrl) && cafe.imageUrl.length > 0) {
        return cafe.imageUrl[0];
      }
      if (typeof cafe.imageUrl === "string" && cafe.imageUrl.trim()) {
        return cafe.imageUrl;
      }
      return "apdev-tbv/cafe4.jpg";
    }

    /**
     * Extracts the last comma-separated segment as the "city".
     * e.g. "Salcedo, Makati" → "Makati"
     */
    function extractCity(location) {
      if (!location) return "Unknown";
      const parts = location.split(",");
      return parts[parts.length - 1].trim() || location.trim();
    }

    /* ── RENDER: RECENTLY ADDED ─────────────────────────── */

    /**
     * Fills #recentlyAddedContainer with the 4 most recently
     * saved cafes (last 4 items in the array, reversed).
     */
    function renderRecentSection(cafes) {
      const container = document.getElementById("recentlyAddedContainer");
      if (!container) return;

      if (!Array.isArray(cafes) || cafes.length === 0) {
        container.innerHTML = `
          <div class="empty-block" style="grid-column:1 / -1;">
            <h3>No recent TBVs yet</h3>
            <p>Add cafes from the Ratings page to start your list.</p>
          </div>`;
        return;
      }

      const recent = [...cafes].reverse().slice(0, 4);

      container.innerHTML = recent.map(cafe => `
        <div class="recent-card">
          <img src="${getImageSrc(cafe)}" alt="${cafe.name || 'Cafe'}">
          <div class="recent-overlay">
            <div class="name">${cafe.name || "Unnamed Cafe"}</div>
            <div class="loc">${cafe.location || "Location unavailable"}</div>
          </div>
        </div>`).join("");
    }

    /* ── RENDER: TOP CITIES ─────────────────────────────── */

    /**
     * Computes the top 3 cities by saved-cafe count and
     * renders them into #topCitiesContainer.
     * Uses the stacked-photo animation when a city has 3+ images.
     */
    function renderTopCities(cafes) {
      const container = document.getElementById("topCitiesContainer");
      if (!container) return;

      if (!cafes.length) {
        container.innerHTML = `
          <div class="empty-block dark" style="grid-column:1 / -1;">
            <h3>No city insights yet</h3>
            <p>Your top cities will appear once you save cafes to your TBV.</p>
          </div>`;
        return;
      }

      // Build a map: city → { count, images[] }
      const cityMap = new Map();
      cafes.forEach(cafe => {
        const city = extractCity(cafe.location);
        if (!cityMap.has(city)) {
          cityMap.set(city, { city, count: 0, images: [] });
        }
        const entry = cityMap.get(city);
        entry.count += 1;
        const img = getImageSrc(cafe);
        if (!entry.images.includes(img)) entry.images.push(img);
      });

      const topCities = [...cityMap.values()]
        .sort((a, b) => b.count - a.count)
        .slice(0, 3);

      container.innerHTML = topCities.map(item => {
        const imgs = item.images;

        // Use the stacked animation when we have 3+ distinct images
        const photoHtml = imgs.length >= 3
          ? `<div class="city-photo stack">
               <img class="p back"  src="${imgs[2]}" alt="${item.city}">
               <img class="p mid"   src="${imgs[1]}" alt="${item.city}">
               <img class="p front" src="${imgs[0]}" alt="${item.city}">
             </div>`
          : `<div class="city-photo">
               <img src="${imgs[0] || 'apdev-tbv/cafe4.jpg'}" alt="${item.city}">
             </div>`;

        return `
          <div class="city-card">
            ${photoHtml}
            <div class="city-name">${item.city.toUpperCase()}</div>
            <div class="city-count">${item.count} cafe${item.count !== 1 ? "s" : ""} saved</div>
          </div>`;
      }).join("");
    }

    /* ── RENDER: SINGLE TBV CARD ────────────────────────── */

    /**
     * Returns the HTML string for one TBV card.
     * Preserves the original card design (tbv-card layout).
     */
    function renderCafeCard(cafe) {
      const amenities = [
        cafe.hasAircon  ? `<img src="icons/ac.png"     alt="Aircon">`  : "",
        cafe.hasSockets ? `<img src="icons/socket.png" alt="Socket">`  : "",
        cafe.hasWifi    ? `<img src="icons/wifi.png"   alt="Wi-Fi">`   : "",
        cafe.hasAltMilk ? `<img src="icons/oat.png"    alt="Alt Milk">`: ""
      ].join("");

      return `
        <article class="tbv-card">
          <div class="tbv-thumb">
            <img src="${getImageSrc(cafe)}" alt="${cafe.name || 'Cafe'}">
          </div>

          <div class="tbv-info">
            <div class="tbv-top">
              <div class="tbv-name">${cafe.name || ""}</div>
              <div class="tbv-loc">${cafe.location || ""}</div>
            </div>

            <div class="tbv-bottom">
              <div></div>
              <div class="tbv-inclusions" aria-label="Inclusions">
                ${amenities}
                <button
                  class="remove-btn"
                  onclick="removeTBV('${cafe._id}')"
                  title="Remove from TBV"
                  aria-label="Remove ${cafe.name || 'cafe'} from TBV"
                ><img src="icons/remove.png" alt="Remove"></button>
              </div>
            </div>
          </div>
        </article>`;
    }

    /* ── RENDER: EMPTY STATE ────────────────────────────── */

    /** Shows the empty state inside #tbvContainer. */
    function renderEmptyState() {
      const container = document.getElementById("tbvContainer");
      if (!container) return;
      container.innerHTML = `
        <div class="empty-tbv">
          <h3>Your TBV is empty ☕</h3>
          <p>Browse cafes and save the ones you want to visit.</p>
          <button class="empty-btn" onclick="window.location.href='ratings.html'">Browse Cafes</button>
        </div>`;
    }

    /** Shows a "no results" state inside #tbvContainer. */
    function renderNoMatch() {
      const container = document.getElementById("tbvContainer");
      if (!container) return;
      container.innerHTML = `
        <div class="empty-tbv">
          <h3>No matching cafes found</h3>
          <p>Try a different search keyword.</p>
        </div>`;
    }

    /* ── RENDER: TBV LIST ───────────────────────────────── */

    /**
     * Renders an array of cafe objects into #tbvContainer.
     * Shows the empty state automatically when the list is empty.
     */
    function renderTBV(cafes) {
      const container = document.getElementById("tbvContainer");
      if (!container) return;

      if (!cafes.length) {
        renderNoMatch();
        return;
      }

      container.innerHTML = cafes.map(renderCafeCard).join("");
    }

    /* ── FILTER / SEARCH ────────────────────────────────── */

    /**
     * Reads the search input and sort select, filters + sorts
     * allTbvCafes in memory, then re-renders the TBV list.
     * Called on: input event, button click, sort change, clear.
     */
    function filterTBV() {
      if (!allTbvCafes.length) {
        renderEmptyState();
        return;
      }

      const query = (document.getElementById("q")?.value || "").trim().toLowerCase();
      const sort  = document.getElementById("sortSelect")?.value || "recent";

      // 1. Filter by search query
      let result = allTbvCafes.filter(cafe => {
        const name     = (cafe.name     || "").toLowerCase();
        const location = (cafe.location || "").toLowerCase();
        const bio      = (cafe.bio      || "").toLowerCase();
        return name.includes(query) || location.includes(query) || bio.includes(query);
      });

      // 2. Sort
      if (sort === "az") {
        result = result.slice().sort((a, b) => (a.name || "").localeCompare(b.name || ""));
      } else if (sort === "za") {
        result = result.slice().sort((a, b) => (b.name || "").localeCompare(a.name || ""));
      }
      // "recent" = default order (as returned by backend)

      // 3. Render
      if (!result.length && query) {
        renderNoMatch();
      } else {
        renderTBV(result);
      }
    }

    /* ── FETCH FROM BACKEND ─────────────────────────────── */

    /**
     * Fetches the user's TBV list from GET /tbv, populates
     * allTbvCafes, and renders all sections of the page.
     * Handles 401 (not logged in) gracefully.
     */
    async function loadTBV() {
      const tbvMessage   = document.getElementById("tbvMessage");
      const tbvContent   = document.getElementById("tbvContent");
      const tbvContainer = document.getElementById("tbvContainer");

      try {
        const res = await fetch("/tbv", { credentials: "include" });

        // Not logged in → show message, hide content
        if (res.status === 401) {
          if (tbvMessage) tbvMessage.style.display = "block";
          if (tbvContent) tbvContent.style.display = "none";
          return;
        }

        const data = await res.json();

        if (tbvMessage) tbvMessage.style.display = "none";
        if (tbvContent) tbvContent.style.display = "block";

        allTbvCafes = Array.isArray(data) ? data : [];

        // Render the supporting sections
        renderRecentSection(allTbvCafes);
        renderTopCities(allTbvCafes);

        // Render the main list (respects current search/sort)
        if (!allTbvCafes.length) {
          renderEmptyState();
        } else {
          filterTBV();
        }

      } catch (err) {
        console.error("Error loading TBV:", err);
        renderRecentSection([]);
        renderTopCities([]);
        if (tbvContainer) tbvContainer.innerHTML = "<p>Error loading TBV. Please try again.</p>";
      }
    }

    /* ── REMOVE FROM TBV ────────────────────────────────── */

    /**
     * Sends POST /tbv/remove for the given establishmentId,
     * then refreshes the entire TBV view without a page reload.
     */
    async function removeTBV(establishmentId) {
      try {
        const res = await fetch("/tbv/remove", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ establishmentId })
        });

        const result = await res.json();

        if (!res.ok) {
          alert(result.message || "Error removing cafe from TBV.");
          return;
        }

        // Optimistically remove from local array so the UI updates instantly,
        // then re-render without hitting the server again.
        allTbvCafes = allTbvCafes.filter(c => c._id !== establishmentId);

        renderRecentSection(allTbvCafes);
        renderTopCities(allTbvCafes);

        if (!allTbvCafes.length) {
          renderEmptyState();
        } else {
          filterTBV();
        }

      } catch (err) {
        console.error("Error removing TBV item:", err);
        alert("Could not remove cafe. Please try again.");
      }
    }
  </script>

</body>
</html>
